# Phase 49: call and response. A line with an id can be answered by lines
# whose reply names it, said by someone else in the company. Replies are
# said only after their prompt.

# --- camp ---
- {id: c-tired, text: "My feet are two sore blisters held together by hope.", ctx: [camp]}
- {text: "Take your boots off and soak them. You will thank me when you are walking tomorrow.", reply: c-tired, arch: [faith, skirmisher]}
- {text: "Blisters? You have no idea. I have a ripe one in a spot I will not mention.", reply: c-tired, pers: [wry, cheerful]}
- {text: "Pain is only the road reminding you that you are alive.", reply: c-tired, pers: [stoic, grim]}

- {id: c-hungry, text: "Is it just me, or does a meal taste twice as good out here?", ctx: [camp]}
- {text: "It is hunger. The best seasoning there is.", reply: c-hungry}
- {text: "Twice as good, and thrice as filling. I am on my third helping.", reply: c-hungry, pers: [cheerful, boastful]}
- {text: "Do not get used to it. The next one may be a handful of dry biscuit.", reply: c-hungry, pers: [grim, stoic]}

- {id: c-dream, text: "Last night I dreamed I was back home. It felt so real.", ctx: [camp]}
- {text: "Home is a story we tell ourselves. This is real enough for me.", reply: c-dream, pers: [stoic, grim]}
- {text: "Tell me about it. What did you miss the most?", reply: c-dream, pers: [cheerful, devout]}
- {text: "I dreamed of a feast. I woke up with a stomachache. Dreams are unreliable.", reply: c-dream, pers: [wry]}

- {id: c-sleep, text: "Somebody take the watch. I am done for.", ctx: [camp]}
- {text: "I will take it. I do not mind the dark.", reply: c-sleep, pers: [stoic, grim]}
- {text: "I have it. Go on, sleep. I will wake you if anything stirs.", reply: c-sleep, arch: [martial, skirmisher]}
- {text: "Not me. I wrote the letter of resignation from watch duty a long time ago.", reply: c-sleep, pers: [wry, boastful]}

- {id: c-story, text: "Does anyone have a story? I could use something to take my mind off the day.", ctx: [camp]}
- {text: "I know one. It is long, it is grand, and I am the hero.", reply: c-story, pers: [boastful]}
- {text: "I know one about a goat and a bridge. It is not very good, but it is short.", reply: c-story, pers: [wry, cheerful]}
- {text: "A tale of the dark places, that is what I have. Perhaps not for the fire.", reply: c-story, pers: [grim]}
- {text: "Let me tell you of a time I was saved by a stranger. It still gives me comfort.", reply: c-story, pers: [devout, cheerful]}

- {id: c-cold, text: "Is it me, or is it getting colder?", ctx: [camp]}
- {text: "Come closer to the fire. There is room for another.", reply: c-cold, pers: [cheerful, devout]}
- {text: "It is not you. Put on another layer and be done with it.", reply: c-cold, pers: [stoic, grim, wry]}

- {id: c-future, text: "Where do you suppose we will be in a year?", ctx: [camp]}
- {text: "Standing, I hope. Everything else is a bonus.", reply: c-future, pers: [grim, stoic]}
- {text: "Richer, famous, and a little wiser. Two of three, perhaps.", reply: c-future, pers: [wry, boastful]}
- {text: "Wherever we are, I hope we are together.", reply: c-future, pers: [cheerful, devout]}

- {id: c-luck, text: "Do you think our luck will hold?", ctx: [camp]}
- {text: "Luck is not a plan. Keep your blade ready and it will not matter.", reply: c-luck, arch: [martial, skirmisher]}
- {text: "Luck? I have never had any. I have had skill and stubbornness.", reply: c-luck, pers: [boastful, stoic]}
- {text: "It is not luck. It is grace, and we should not squander it.", reply: c-luck, pers: [devout]}

- {id: c-wound, text: "That scrape from earlier is starting to throb.", ctx: [camp]}
- {text: "Let me look at it. Do not be brave about it, it only makes it worse.", reply: c-wound, arch: [faith]}
- {text: "It is only a scrape. Tell it to stop and it will.", reply: c-wound, pers: [wry, boastful]}
- {text: "Keep it clean. Infection kills more than blades.", reply: c-wound, pers: [grim, stoic]}

- {id: c-old, text: "How long have you been on the road?", ctx: [camp]}
- {text: "Longer than I care to count. Long enough that it feels like home.", reply: c-old, pers: [stoic, grim, wry]}
- {text: "Not long enough! There is so much more to see.", reply: c-old, pers: [cheerful, devout]}
- {text: "Long enough to have a name that people spit on. Fine by me.", reply: c-old, align: [evil]}

- {id: c-why, text: "Why did you join this company, anyway?", ctx: [camp]}
- {text: "Coin, at first. Then the company. Strange how that goes.", reply: c-why, pers: [wry, stoic]}
- {text: "Because someone had to. And I could.", reply: c-why, align: [good]}
- {text: "To see where the road went. It is still going.", reply: c-why, pers: [cheerful, devout]}
- {text: "Because I was the best option. Obviously.", reply: c-why, pers: [boastful]}

- {id: c-moon, text: "Look at that moon. It is almost too bright to sleep.", ctx: [camp]}
- {text: "Then do not sleep. I will keep you company.", reply: c-moon, pers: [cheerful, devout]}
- {text: "A bright moon means long shadows. I do not like long shadows.", reply: c-moon, pers: [grim]}
- {text: "A bright moon is a good friend to anyone who works in the dark.", reply: c-moon, arch: [skirmisher]}

- {id: c-song, text: "Anyone know a marching song? I am out of ideas to keep my feet moving.", ctx: [camp]}
- {text: "I know forty. None of them clean.", reply: c-song, pers: [wry, boastful]}
- {text: "Hum along, then. I will start slow.", reply: c-song, pers: [cheerful]}
- {text: "A hymn, perhaps? It works as well as a march, and sits better in the heart.", reply: c-song, pers: [devout]}

- {id: c-wake, text: "I could not sleep. Did you hear something out there last night?", ctx: [camp, rested]}
- {text: "Only the wind. Go back to sleep.", reply: c-wake, pers: [stoic, wry]}
- {text: "I heard it. Something moved at the edge of the light. I do not think it came closer.", reply: c-wake, arch: [skirmisher]}
- {text: "Yes. I have been listening to it all night. It sounds hungry.", reply: c-wake, pers: [grim]}

# --- rested ---
- {id: r-morning, text: "Good morning, everyone. Did we all survive the night?", ctx: [rested]}
- {text: "Every last one of us. I counted. Twice.", reply: r-morning, pers: [stoic, grim]}
- {text: "Better than ever. I could eat a whole roast.", reply: r-morning, pers: [cheerful, boastful]}
- {text: "Barely. Someone snores like a landslide.", reply: r-morning, pers: [wry]}
- {text: "By grace, we did. Let us give thanks and move on.", reply: r-morning, pers: [devout]}

- {id: r-ready, text: "Are we ready to move on?", ctx: [rested]}
- {text: "I was ready an hour ago.", reply: r-ready, pers: [stoic, boastful]}
- {text: "Give me a moment. My boots are not on right.", reply: r-ready, pers: [wry, cheerful]}
- {text: "As ready as I will ever be.", reply: r-ready, pers: [grim]}

# --- win ---
- {id: w-nice, text: "Nice work back there. That went about as well as it could.", ctx: [win]}
- {text: "I learned a lot from watching you. Mostly what not to do.", reply: w-nice, pers: [wry]}
- {text: "Thank you. I noticed. I always notice.", reply: w-nice, pers: [boastful]}
- {text: "You as well. We make a good team.", reply: w-nice, pers: [cheerful, stoic, devout]}

- {id: w-hurt, text: "Are you hurt? You took a few hits there.", ctx: [win]}
- {text: "Nothing a bandage will not fix.", reply: w-hurt, pers: [stoic, grim, wry]}
- {text: "Only my pride. And my ribs.", reply: w-hurt, pers: [wry, cheerful, boastful]}
- {text: "I am well, truly. Thank you for asking.", reply: w-hurt, pers: [devout, cheerful]}

- {id: w-loot, text: "Let us see what they were carrying.", ctx: [win]}
- {text: "Quickly. Before someone else finds the scene.", reply: w-loot, align: [evil, neutral]}
- {text: "Only what we need. The rest we leave alone.", reply: w-loot, align: [good]}

- {id: w-count, text: "Is everyone accounted for?", ctx: [win]}
- {text: "All here. Bruised, but here.", reply: w-count, pers: [stoic, wry, cheerful]}
- {text: "All but my patience. That ran out some time ago.", reply: w-count, pers: [wry, grim]}

# --- close ---
- {id: x-close, text: "That was far too close. My hands are still shaking.", ctx: [close]}
- {text: "Breathe. It is over. We are alive.", reply: x-close, pers: [stoic, devout]}
- {text: "Shaking? I am nearly dancing. We made it!", reply: x-close, pers: [cheerful, boastful]}
- {text: "Next time we do it smarter. Or we do not do it at all.", reply: x-close, pers: [grim, wry]}

# --- fall ---
- {id: f-fall, text: "I did not see it coming. One moment {fallen} was there, and then...", ctx: [fall]}
- {text: "None of us did. Do not blame yourself.", reply: f-fall, pers: [stoic, devout, cheerful]}
- {text: "We cannot change it. We can only go on.", reply: f-fall, pers: [grim, wry]}
- {text: "Let us make sure it counts for something.", reply: f-fall, align: [good]}

# --- flawless ---
- {id: l-flaw, text: "Not a scratch on anyone. Is that even possible?", ctx: [flawless]}
- {text: "Apparently it is, if we all do our parts.", reply: l-flaw, pers: [stoic, wry, devout]}
- {text: "It is when you fight with me.", reply: l-flaw, pers: [boastful]}
- {text: "I am not complaining. Let us do that again.", reply: l-flaw, pers: [cheerful, grim]}
