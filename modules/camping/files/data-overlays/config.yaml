# Phase 7 camping eligibility.
#
# RoomTag is the room `tags` entry that admits `camp` in that room. The
# proving room (2002, Fork at the Black Oak) carries this tag.
#
# Phase 16: a camp rest restores 20 fatigue scaled by the camp zone's
# weather RestRecoveryPct, locked when the rest starts.
RoomTag: camping

# Phase 16 inns. A room tagged InnRoomTag admits `inn rest`: the company
# pays PricePerMember gold per member and rests for InnRestDuration (real
# time), recovering InnFatigueRecovery fatigue. On waking, the leader and
# every spawned companion gain buff WellRestedBuffId (Well Rested, which
# halves walking strain). Weather never touches an inn rest.
InnRoomTag: inn
PricePerMember: 5
InnRestDuration: 60s
InnFatigueRecovery: 60
WellRestedBuffId: 1030
# Phase 23a rest tiers. A finished camp rest gives the leader and every
# live companion RestedBuffId (Rested: walking strain cut to RestedPct in
# modules/walking) for RestedDuration; an inn stay gives Well Rested for
# WellRestedDuration. Durations are real time (e.g. 15m, or seconds),
# converted to rounds when granted; like every buff they only count down
# while the holder is in the world. Well Rested replaces Rested, and a
# camp rest never downgrades Well Rested (it still restores fatigue).
# Companion mobs lose their buffs when they despawn, so each companion's
# grant is kept until it would have run out: one absent at the grant, or
# respawned after a relog, restart, or copyover, gets the tier for the
# time left. Each rest grants once and is never extended.
RestedBuffId: 1033
RestedDuration: 15m
WellRestedDuration: 30m
# Phase 23b whetstones. `sharpen` (or `camp sharpen`), at any time but
# never mid-fight, spends one use of the leader's whetstone (item
# WhetstoneItemId, 10 uses) per company member whose dull blades it
# sharpens: two blades on one member cost one use, and members already
# sharp or with no blade cost nothing. Members are sharpened leader first,
# then companions by number, until the stones run out. A bladed weapon is
# a slashing, cleaving, or stabbing one in either hand, and a companion
# must be in the leader's room. Each sharpened blade gains SharpenedBonus
# damage on its next SharpenedStrikes successful strikes; an edge never
# stacks or resets. `sharpen auto on` also sharpens when a camp rest ends.
WhetstoneItemId: 30
SharpenedBonus: 1
SharpenedStrikes: 20
# Phase 33f3 Field Smith: a warrior at the whetstone adds this many strikes
# of edge per level (0 turns it off).
FieldSmithStrikesPerLevel: 5

# Phase 33f3 camp specialists.
# CampRaids: a camp rest in a zone listed here may draw raiders of MobId
# (ChancePct per rest, rolled when the rest starts), arriving between
# RaidEarliestPct and RaidLatestPct of the way through the rest. A watch (a
# warrior) spots them with WatchPctPerLevel% per level; unspotted, the rest
# earns no Rested tier and no camp rewards.
CampRaids:
  - { Zone: Old Kings Road, MobId: 86, ChancePct: 15 }
WatchPctPerLevel: 25
RaidEarliestPct: 30
RaidLatestPct: 70
# Vigil: a cleric at a completed rest raises each present companion's
# loyalty by its level, never above VigilCap.
VigilCap: 60
# Forage: a ranger at a completed rest finds ForageBase + level /
# ForageLevelsPerOne items from the zone's weighted table, into cargo.
ForageBase: 1
ForageLevelsPerOne: 2
Forage:
  - Zone: Old Kings Road
    Items:
      - { ItemId: 29, Weight: 3 }    # raw game meat
      - { ItemId: 30018, Weight: 2 } # wild thyme
      - { ItemId: 30007, Weight: 1 } # mushroom
# Camp cooking ("camp cook"): the Waymark Inn hearth's dishes, tried in
# order; the first the cook has the ingredients and Cooking for is made.
CampRecipes:
  - { Output: 30019, Inputs: [29, 29, 30018], Skill: cooking, MinLevel: 3 } # hunter's stew
  - { Output: 30020, Inputs: [29, 30018], Skill: cooking, MinLevel: 2 }     # thyme-roasted game
  - { Output: 30021, Inputs: [29], Skill: cooking, MinLevel: 1 }            # seared game meat
  - { Output: 30024, Inputs: [43], Skill: cooking, MinLevel: 1 }            # grilled fish (Phase 40a2)
# Forage and Vigil come at most once per this real time, per company.
CampRewardCooldown: 15m
