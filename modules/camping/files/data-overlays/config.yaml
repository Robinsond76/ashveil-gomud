# Phase 7 camping eligibility.
#
# RoomTag is the room `tags` entry that admits `camp` in that room. The
# proving room (2002, Fork at the Black Oak) carries this tag.
#
# Phase 16: a camp rest restores 20 fatigue scaled by the camp zone's
# weather RestRecoveryPct, locked when the rest starts.
RoomTag: camping

# Phase 16 inns. A room tagged InnRoomTag admits `inn rest`: the company
# pays PricePerMember gold per member and rests for InnRestDuration (real
# time), recovering InnFatigueRecovery fatigue. On waking, the leader and
# every spawned companion gain buff WellRestedBuffId (Well Rested, which
# halves walking strain). Weather never touches an inn rest.
InnRoomTag: inn
PricePerMember: 5
InnRestDuration: 60s
InnFatigueRecovery: 60
WellRestedBuffId: 1030
# Phase 23a rest tiers. A finished camp rest gives the leader and every
# live companion RestedBuffId (Rested: walking strain cut to RestedPct in
# modules/walking) for RestedDuration; an inn stay gives Well Rested for
# WellRestedDuration. Durations are real time (e.g. 15m, or seconds),
# converted to rounds when granted; like every buff they only count down
# while the holder is in the world. Well Rested replaces Rested, and a
# camp rest never downgrades Well Rested (it still restores fatigue).
# Companion mobs lose their buffs when they despawn, so each companion's
# grant is kept until it would have run out: one absent at the grant, or
# respawned after a relog, restart, or copyover, gets the tier for the
# time left. Each rest grants once and is never extended.
RestedBuffId: 1033
RestedDuration: 15m
WellRestedDuration: 30m
