# Phase 19 settlement markets.
#
# A settlement is a zone. Only zones listed here have a market; every
# other zone reports "There's no market here." Each good is tracked by
# item ID with its own stock ledger. Price is always derived from current
# stock: MaxPrice at stock 0, BasePrice at TargetStock, MinPrice at
# MaxStock, linear in between. Each round, stock drifts one bounded step
# (1..DriftStep) toward TargetStock and then stays there. StartStock is
# only used the first time a good is seen; after that the persisted stock
# is kept across restart/copyover.
#
# Rules (a good breaking one is skipped with a warning):
#   0 < MinPrice <= BasePrice <= MaxPrice
#   0 < TargetStock < MaxStock
#   0 <= StartStock <= MaxStock
#   1 <= DriftStep <= MaxStock
#   the item ID must exist; a zone listing an item twice gets no market.
# SupplyOnly: true (Phase 40a2) makes a good one the market sells but never
# buys back ("never" in the You sell column), for supplies anyone can
# gather for free (firewood), so gathering is not a money loop.
#
# Phase 19b: the market itself lives in any room of a market zone tagged
# with RoomTag (Dunmar Market Square, 2004; Trappers' Post, 2005). Only
# there can players list prices (market) and trade one unit at a time
# (market buy <good>, market sell <good>). The market is its own trader;
# shopkeepers keep their own prices. "You buy" is the stock price above;
# "You sell" is that price less SpreadPct percent, and never reaches the
# next unit's buy price, so buying and selling straight back always loses
# money. Buying takes one unit from stock (the price rises); selling adds
# one (the price falls). The market sells nothing at stock 0 and buys
# nothing at MaxStock.
#
# The proving content starts Dunmar short of hides and meat and the
# Trappers' Post glutted with hides, so both markets visibly drift after
# boot, and hides are cheaper at the post than in town.
#
# Phase 20 trade rumours: every RumorRefreshRounds rounds the markets'
# stock is written down as the news (persisted with the ledger). In any
# room tagged RumorRoomTag (inns, in any zone) players can ask "rumors" (or
# "rumours") and hear up to RumorsPerAsk hints drawn from that news: which
# market is short of or drowning in a good, and, for goods traded in two
# or more markets, where it comes cheapest and who pays best. Rumours
# never quote prices, and they are only as fresh as the last snapshot.
RoomTag: market
SpreadPct: 20 # 1..90
# Phase 33f2 Haggle: the company's best haggler (a rogue) improves market
# prices by this many percent per level (0..10; 0 turns it off). A sale is
# never paid more than one below what buying it back would cost.
HagglePctPerLevel: 2
RumorRoomTag: inn
RumorRefreshRounds: 150 # 1..100000; 150 rounds is 10 minutes at 4-second rounds
RumorsPerAsk: 3 # 1..10
