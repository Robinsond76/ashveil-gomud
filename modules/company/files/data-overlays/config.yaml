StarterPackItemId: 38
AllowedCompanionMobIDs:
  - 58
MaxCompanions: 4
# Phase 17: the archetype a newly summoned companion of each mob template
# takes. It must name an archetype configured in modules/archetype; an
# unknown one is skipped and logged. A companion without an archetype can
# be given one, once, with "company archetype <member> <archetype>".
CompanionArchetypes:
  - { MobTemplateId: 58, Archetype: warrior }
  - { MobTemplateId: 61, Archetype: warrior }
  - { MobTemplateId: 62, Archetype: cleric }
  - { MobTemplateId: 63, Archetype: warrior }
  - { MobTemplateId: 64, Archetype: ranger }
  - { MobTemplateId: 69, Archetype: rogue }
  # Phase 32a2 generated recruit bases (see RecruitTemplates).
  - { MobTemplateId: 80, Archetype: warrior }
  - { MobTemplateId: 81, Archetype: rogue }
  - { MobTemplateId: 82, Archetype: wizard }
  - { MobTemplateId: 83, Archetype: cleric }
  - { MobTemplateId: 84, Archetype: ranger }
  - { MobTemplateId: 94, Archetype: witch } # Phase 38a
  - { MobTemplateId: 130, Archetype: halberdier } # Phase 39a
  - { MobTemplateId: 139, Archetype: samurai } # Phase 39b
  - { MobTemplateId: 160, Archetype: dollmaster } # Phase 39d
  - { MobTemplateId: 175, Archetype: gryphon-rider } # Phase 39f
  - { MobTemplateId: 150, Archetype: shaman } # Phase 39c
# Phase 21a: company alignment. Values are alignment points on the
# -100..100 scale players see. Out-of-range values fall back to the
# default.
#
# Every DriftEveryRounds rounds (1..100000), each companion of an online
# leader moves DriftStep (1..50) toward the average alignment of the rest
# of the company (the leader and the other companions). The leader doesn't
# drift.
DriftEveryRounds: 75
DriftStep: 2
# On each drift tick a companion further than LoyaltyToleranceGap (0..200)
# from the rest of the company loses LoyaltyLoss (0..100) loyalty;
# otherwise it gains LoyaltyGain (0..100), up to 100. Falling below
# LoyaltyWarnBelow (0..100) warns the leader; at 0 the companion deserts
# (after any fight the leader is in).
LoyaltyToleranceGap: 60
LoyaltyLoss: 5
LoyaltyGain: 2
LoyaltyWarnBelow: 25
# A new recruit's loyalty (1..100).
StartLoyalty: 70
# "company summon" refuses a candidate further than RecruitMaxGap (0..200)
# from the company average (the leader and every companion). Keep it at or
# below LoyaltyToleranceGap, or accepted recruits start out uneasy and
# losing loyalty. Keep StartLoyalty above LoyaltyWarnBelow, or new recruits
# start below the warning line and are never warned.
RecruitMaxGap: 60
# Phase 22c: settlement recruiters. A recruiter is a room; "company
# recruit" there lists its candidates, and "company recruit <candidate>"
# takes one on. A candidate's Id is the word players type. Price is in
# gold. A Tutorial candidate is free (its Price is ignored) and can be
# claimed once per account (alts share it), ever: the claim outlives
# dismissal, and it is keyed by MobTemplateId, so offering the same
# template at two recruiters is still one claim. Don't also list a
# candidate template in AllowedCompanionMobIDs, or "company summon" would
# skip the price and the claim. Candidate templates should wear their gear,
# carry nothing, have no gold, and use itemdropchance 0 and no loot
# category, so a recruit can't be farmed for items.
# Entries with no room, a blank or repeated Id, no template, or a negative
# price are skipped with a warning.
#
# Phase 32a2: a Generated recruiter also posts each player's own roster of
# generated candidates (see RosterSize below); ArchetypeWeights, when set,
# is its own archetype mix ([{Archetype, Weight}]; an archetype left out
# never appears there).
# Phase 30b physicians: `heal wounds` in one of these rooms offers to close
# every lasting wound left, for PricePerWound gold each (a yes/no prompt).
# Rooms are matched by their template room, as recruiters are.
Physicians:
  - RoomId: 2003 # the Waymark Inn, Dunmar
    Name: the inn's physician
    Description: a stooped figure with ink-stained cuffs
    PricePerWound: 15
Recruiters:
  - RoomId: 2003 # the Waymark Inn, Dunmar
    Name: the hiring slate by the hearth
    Generated: true
    Candidates:
      - { Id: tamsin, MobTemplateId: 61, Tutorial: true }
      - { Id: oswin, MobTemplateId: 62, Tutorial: true }
      - { Id: garrick, MobTemplateId: 63, Price: 120 }
  - RoomId: 901 # the Muster Yard (tutorial; each player's copy resolves here)
    Name: the notched hiring post
    Candidates:
      - { Id: tamsin, MobTemplateId: 61, Tutorial: true }
      - { Id: oswin, MobTemplateId: 62, Tutorial: true }
  - RoomId: 907 # the Oath Stone (tutorial Alignment lesson; inspected, and refused to a new company)
    Name: the notices at the oath stone's foot
    Candidates:
      - { Id: corvin, MobTemplateId: 69, Price: 150 }
  - RoomId: 2005 # Trappers' Post, Old Kings Road
    Name: the notched stick by the lean-to
    Generated: true
    ArchetypeWeights:
      - { Archetype: ranger, Weight: 4 }
      - { Archetype: warrior, Weight: 2 }
      - { Archetype: rogue, Weight: 2 }
      - { Archetype: cleric, Weight: 1 }
      - { Archetype: wizard, Weight: 1 }
    Candidates:
      - { Id: ysolde, MobTemplateId: 64, Price: 80 }
# Phase 32a2: per-player recruit rosters. At a Generated recruiter each
# player sees their own RosterSize (0..8; 0 turns rosters off) generated
# candidates, below the authored ones; what one player hires never changes
# another's list. Each candidate stays CandidateStayRoundsMin..Max world
# rounds (900 rounds is a game day; offline time counts), then leaves and a
# new one takes the slot. A hired candidate's slot fills again after
# RefillDelayRoundsMin..Max rounds. Rounds are only read, never advanced.
# A candidate's level is the leader's, -1 to +1 (at least 1); its alignment
# is RecruitAlignmentMin..Max (-100..100), so some are refused by the
# RecruitMaxGap gate; its price is (RecruitPriceBase + RecruitPricePerLevel
# x level) x the template's PricePercent / 100. RecruitTemplates are the
# base mob per archetype (the archetype comes from CompanionArchetypes);
# keep them to the recruit shape above (itemdropchance 0, no gold, no
# loot). Names are a given name (unique within a player's company and
# rosters, and the word players type) plus, RecruitBynamePercent of the
# time, a byname. Each candidate has one RecruitTraits line.
RosterSize: 3
CandidateStayRoundsMin: 450
CandidateStayRoundsMax: 1800
RefillDelayRoundsMin: 60
RefillDelayRoundsMax: 180
RecruitPriceBase: 30
RecruitPricePerLevel: 30
RecruitAlignmentMin: -80
RecruitAlignmentMax: 80
RecruitBynamePercent: 60
# Phase 35c: RecruitSkilledPercent of generated candidates arrive knowing
# one optional skill their archetype may learn (archetype OptionalSkills),
# at rank 2 RecruitSkillRank2Percent of the time, else rank 1. Each rank
# adds RecruitSkillPricePercent to the price. The ranks cost the companion
# no training points.
RecruitSkilledPercent: 20
RecruitSkillRank2Percent: 20
RecruitSkillPricePercent: 15
RecruitTemplates:
  - { MobTemplateId: 80, Weight: 1 }
  - { MobTemplateId: 81, Weight: 1, PricePercent: 90 }
  - { MobTemplateId: 82, Weight: 1, PricePercent: 110 }
  - { MobTemplateId: 83, Weight: 1, PricePercent: 110 }
  - { MobTemplateId: 84, Weight: 1 }
  - { MobTemplateId: 94, Weight: 1, PricePercent: 110 }
  - { MobTemplateId: 130, Weight: 1, PricePercent: 105 }
  - { MobTemplateId: 139, Weight: 1, PricePercent: 110 }
  - { MobTemplateId: 160, Weight: 1, PricePercent: 110 }
  - { MobTemplateId: 175, Weight: 1, PricePercent: 110 } # Phase 39f
  - { MobTemplateId: 150, Weight: 1, PricePercent: 110 }
RecruitGivenNames: [Hild, Anselm, Tobin, Wren, Edda, Bram, Ilse, Corrin, Maud, Osric, Petra, Aldo, Sabine, Lorn, Nessa, Joren, Thea, Ulric, Brisa, Cade, Fenna, Hugo, Ines, Kester, Liesl, Merrit, Orla, Quill, Rowan, Senna]
RecruitBynames: [Marrow, Reyes, Ashdown, Thorne, Pike, Holloway, of the Ford, of Dunmar, the Younger, Fletcher, Cobb, Wick, Harrow, Stane]
RecruitTraits:
  - A scarred former caravan guard, still in the habit of watching the treeline.
  - Quiet, and quick with a sling.
  - Laughs easily and eats like two, but never shirks a watch.
  - Was a miller's apprentice until the mill burned; hasn't said how.
  - Keeps a tally of every road walked, scratched on a strip of hide.
  - Soft-spoken, with a soldier's way of standing.
  - Talks to the weather as if it might answer.
  - Wants enough coin to buy back a family plot, and says so often.
  - Knows three songs and sings all of them badly.
  - Came down from the hill farms after a bad winter and means to see the world.
  - Careful with gear, careless with words.
  - Once served a lord's hunt and still flinches at horns.
# Phase 24: company chemistry. Each member serves the band for every round
# it is alive and in one room with at least one other member while the
# leader is signed in. A band (the members together in a room) takes its
# tier from the average service of its members: reaching
# ChemistryFamiliarRounds, ChemistryTrustedRounds, or ChemistrySwornRounds
# (1..1000000, strictly increasing; 900 rounds is one game day) gives
# everyone in the band the matching bonus (0..10, never decreasing) in
# percentage points of hit chance. A new recruit counts as 0 service, so it
# pulls the average down until it settles in, and in the average no member
# counts for more than ChemistrySwornRounds. A tier-up takes effect at the
# next company save (at most about five minutes). A set out of order falls
# back to all the defaults.
ChemistryFamiliarRounds: 900
ChemistryTrustedRounds: 2700
ChemistrySwornRounds: 6300
ChemistryFamiliarBonus: 2
ChemistryTrustedBonus: 4
ChemistrySwornBonus: 6
# Phase 25b: a companion who dies stays dead on the roster. Its leader has
# this many game days (RoundsPerDay x RoundSeconds of real time each; 3 days
# is 3 hours under the default calendar) of their own online time to bring
# the company to a city church or village shaman and resurrect it. Offline
# time and server downtime are never counted. When it runs out, the
# companion is lost and its roster slot freed. Changing this affects only
# later deaths.
ResurrectionAllowanceDays: 3
# Phase 33h3: a companion separated from its leader (left behind by a
# move, or away for two rounds) rejoins after this many rounds (1..10000)
# of the leader's online time, once the leader is out of any fight,
# journey, or camp rest. 15 rounds is about a minute.
SeparationRounds: 15

# Phase 49: companion banter. The chance, in percent (0..100), that the
# company talks as a camp rest begins (BanterCampStartPercent), as one ends
# (BanterRestedPercent), and after a won battle (BanterBattlePercent). A
# player can turn banter off with `set banter off`.
BanterCampStartPercent: 100
BanterRestedPercent: 50
BanterBattlePercent: 33
