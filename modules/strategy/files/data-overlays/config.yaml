# Phase 32d: battle strategies.
#
# A battle plays out on its own. Each character (the player and each
# companion) fights by a strategy set beforehand with the strategy command:
# a role (fighter, healer, caster) and a target rule. Only settings that
# differ from a character's default are stored.
#
# AutoSpells are the only spells ever cast automatically in a battle, in
# the order tried, with what each is for:
#   heal        heals one (a healer's single heal)
#   heal-all    heals the company (a healer's group heal)
#   attack      harms one foe (a caster's spell)
#   attack-all  harms the foe's group (a caster's spell at two or more foes)
#   hex         a Witch's hex: takes foes' turns away (Phase 38a)
#   big-heal    a heavy heal for an ally under 40% health (Phase 38b)
#   rejuv       a heal over time, for an ally above 35% health
#   grove       a heal over time on a whole formation row
#   ward        absorbs an ally's next blows, cast while no one needs healing
#   bark        armor for an ally, cast while no one needs healing
#   bless       Attack and Evasion for an ally, cast while no one needs healing
#   siphon      drains a foe and heals the most hurt ally
#   summon      calls the class summon (Angel, Demon) as the battle opens
#   raise       raises a fallen foe as a thrall (a Necromancer)
#   weather     a Shaman's weather call (fog, chill wind, rain), when none is up (Phase 39c)
#   storm       a Shaman's Lightning, ahead of its attack spell (Phase 39c)
# A character casts the first listed spell of a use that it knows and can
# pay for. Unknown spells are dropped at load with a warning.
AutoSpells:
  - { Spell: heal, Use: heal }
  - { Spell: healall, Use: heal-all }
  - { Spell: mm, Use: attack }
  - { Spell: sparks, Use: attack-all }
  # Phase 38a: a Witch (role controller) casts the first listed hex that has
  # a foe worth it (one not already under it or newly hexed), then its
  # single-target attack spell. The order is the preference: paralysis, sleep,
  # knockdown, exposure, hobble, poison, dread, and blight (only at a healer).
  - { Spell: binding, Use: hex }
  - { Spell: slumber, Use: hex }
  - { Spell: earthbind, Use: hex }
  - { Spell: frailty, Use: hex }
  - { Spell: leaden, Use: hex }
  - { Spell: miasma, Use: hex }
  - { Spell: dread, Use: hex }
  - { Spell: blight, Use: hex }
  - { Spell: hex, Use: attack }
  # Phase 38b: the class spells; a character casts one only when its class
  # (or level) has taught it.
  - { Spell: greaterheal, Use: big-heal }
  - { Spell: rejuvenation, Use: rejuv }
  - { Spell: grove, Use: grove }
  - { Spell: siphon, Use: siphon }
  - { Spell: ward, Use: ward }
  - { Spell: arcaneward, Use: ward }
  - { Spell: barkskin, Use: bark }
  - { Spell: bless, Use: bless }
  - { Spell: entangle, Use: hex }
  - { Spell: callhost, Use: summon }
  - { Spell: bindfiend, Use: summon }
  # Phase 38c3: a Necromancer raises a fallen foe as a thrall.
  - { Spell: raisefallen, Use: raise }
  # Phase 39c: a Shaman (role caster) calls a weather first when none is up,
  # in the order tried (Rain only once it knows Lightning, fog and a chill
  # only against foes that shoot or cast), then Lightning, then Gust.
  - { Spell: rain, Use: weather }
  - { Spell: chillwind, Use: weather }
  - { Spell: callfog, Use: weather }
  - { Spell: lightning, Use: storm }
  - { Spell: gust, Use: attack }
  - { Spell: stoneskin, Use: bark }
