# Phase 27a: the Ashveil tutorial. The course runs in per-player copies of
# the rooms listed in SpecialRooms.TutorialRooms (one room per stage, in
# order); the way to the next room opens when a stage is passed.
#
# GraduationItemId is given once, when a player walks out of the last room
# having finished the course; skipping gives nothing.
GraduationItemId: 20043
# The free tutorial recruits of the Company stage (the Muster Yard's
# candidates in the company module's Recruiters). When both have already
# been claimed and the company is short, "tutorial next" lets the player
# through.
TutorialRecruits: [61, 62]
# Phase 27b: the Survival stage's supplies, given once per character on
# first reaching it, and only for what the player lacks: RationItemId when
# they carry nothing to eat, WaterItemId when nothing to drink.
RationItemId: 30004
WaterItemId: 30015
