# Phase 25a: player death and the church return.
#
# A player who dies loses one level (never below 1; the engine's protection
# levels don't apply) and wakes at the church of the last city they visited,
# with every living companion. The engine's XP penalty and permadeath don't
# apply to an Ashveil death; its item-drop and corpse rules still do.
#
# Settlements: each has a Zone, a Kind (city or village), a ServiceRoomId,
# and a ServiceMobId. A city's service room is its church and must carry the
# "church" room tag; a village's is its shaman's and must carry "shaman".
# Entering any room of a city whose church is usable makes that church the
# player's checkpoint. Villages never do. An entry with no zone, an unknown
# kind, or no room, or a zone listed twice, is skipped with a warning.
#
# Phase 25b: ServiceMobId is the mob template of the priest or shaman who
# resurrects dead companions there (resurrect <member>); they must be alive
# in the service room. A settlement without one can't resurrect.
Settlements:
  - { Zone: Frostfang, Kind: city, ServiceRoomId: 18, ServiceMobId: 4 }
  - { Zone: Dunmar, Kind: city, ServiceRoomId: 2007, ServiceMobId: 65 }
  - { Zone: Fernhollow, Kind: village, ServiceRoomId: 2009, ServiceMobId: 66 }
# Where a player wakes when their checkpoint is missing or no longer a usable
# church. If this room doesn't load either, the death waits (the level is
# already taken, and never taken twice) until an operator repairs it.
FallbackRoomId: 18
# Health and mana on waking, as a percentage (1..100) of the new maximums.
RespawnVitalsPct: 50

# Phase 53: defeat scenarios. A new death that fits a row below ends there
# instead of at the church, with no level lost (the recovery is the cost).
# When no row fits, the church and the level loss stand. Each row:
#   Id, Kind (rescued | captured | left-for-dead | robbed), Weight (its share
#   among the rows that fit, default 1), Foes (the killer's race name or mob
#   group; empty fits any foe, including an unknown killer), Zones (the zone
#   the company fell in; empty fits any), Text (what the leader reads on
#   waking; empty uses the kind's own).
#   rescued:       Hunger, Fatigue (members wake at or below these; defaults
#                  45 and 20)
#   captured:      Room (the capture room), GuardMob, GuardCount, GuardLevel,
#                  GoldLossPct (share of gold gone for good; the rest is held
#                  with the pack until `reclaim`)
#   left-for-dead: WoundPct (a lasting wound each, in percent of max health)
#   robbed:        GoldLossPct, ItemLossPct, ItemLossMax (loose goods only;
#                  equipped gear, quest tokens, keys and camp gear are safe)
# Test content: the capture room is the Brigands' Tent (91001); the world
# replaces these rows.
Scenarios:
  - { Id: wayfarer-rescue, Kind: rescued, Weight: 2 }
  - { Id: brigand-capture, Kind: captured, Weight: 3, Foes: [human, elf, goblin, troll, ogre, riffraff],
      Room: 91001, GuardMob: 86, GuardCount: 2, GuardLevel: 2, GoldLossPct: 25 }
  - { Id: brigand-robbery, Kind: robbed, Weight: 2, Foes: [human, elf, goblin, troll, ogre, riffraff],
      GoldLossPct: 20, ItemLossPct: 25, ItemLossMax: 4 }
  - { Id: left-for-dead, Kind: left-for-dead, Weight: 3,
      Foes: [rodent, canine, giant spider, insect, reptile, reptilian, beast, undead, lagomorph, monkey, ghostly spirit, fungus, demon, eldritch horror],
      WoundPct: 20 }
