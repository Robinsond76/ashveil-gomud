# Phase 17 archetypes (user decision 3: archetypes are exclusive).
#
# Each archetype claims skills and spell schools. Only archetypes that list
# a skill may train it (several may share one, like cast); only archetypes
# that list a spell school may learn its spells. Skills and schools no
# archetype claims are open to everyone ("trade skills").
#
# GrantSkills/GrantSpells are applied once when a player chooses the
# archetype (never lowering a higher level). CompanionLevels are the
# character levels at which a companion of this archetype reaches utility
# skill levels 1..4. Utility names the utility actions it performs.
# Kit (Phase 22a) is the starter kit's item ids, granted once into the
# backpack of a player who chooses the archetype; repeat an id to give two.
# Every kit ends with a satchel (item 31, Phase 32f) for its carrying share.
# Unknown ids are dropped at load with a warning. Keep kit values balanced
# (the shipped-data test allows the largest total 1.25x the smallest).
# CompanionSpells (Phase 32d) are the spells a companion of the archetype
# knows from a character level, cast in battle by its strategy; each must
# be in the archetype's Schools (else it is dropped at load with a warning).
# GrantSpells reach existing characters too: they are applied at every login.
# Growth (Phase 33h1) weights a companion's stat points by stat (strength,
# speed, smarts, vitality, mysticism, perception); its training is always
# its level's points dealt by these weights, plus its own growth focus.
# (Lists, not maps: module config maps are flattened by the loader.)
Archetypes:
  - ArchetypeId: warrior
    Name: Warrior
    Description: Frontline fighters who trust steel and grit.
    Skills: [brawling, dual-wield]
    GrantSkills:
      - { Skill: brawling, Level: 1 }
    Utility: [watch, fieldsmith]
    Growth:
      - { Stat: strength, Weight: 4 }
      - { Stat: vitality, Weight: 3 }
      - { Stat: speed, Weight: 2 }
      - { Stat: perception, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10002, 20004, 20020, 30004, 30015, 31]
  - ArchetypeId: rogue
    Name: Rogue
    Description: Quiet hands that find traps and open locks.
    Skills: [skulduggery]
    GrantSkills:
      - { Skill: skulduggery, Level: 1 }
    Utility: [traps, keeneye, haggle]
    Growth:
      - { Stat: speed, Weight: 4 }
      - { Stat: perception, Weight: 3 }
      - { Stat: strength, Weight: 2 }
      - { Stat: smarts, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10004, 8, 20029, 20003, 23, 30004, 30015, 31]
  - ArchetypeId: wizard
    Name: Wizard
    Description: Scholars of the arcane who light the dark and bend illusion.
    Skills: [cast, enchant]
    Schools: [illusion, conjuration]
    GrantSkills:
      - { Skill: cast, Level: 1 }
    GrantSpells: [floatinglight, mm]
    CompanionSpells:
      - { Spell: mm, Level: 1 }
      - { Spell: sparks, Level: 5 }
    Utility: [light, weather]
    Growth:
      - { Stat: mysticism, Weight: 4 }
      - { Stat: smarts, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: speed, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10021, 20020, 20008, 20039, 30004, 30015, 30014, 30014, 31]
  - ArchetypeId: cleric
    Name: Cleric
    Description: Healers and protectors sworn to keep the company standing.
    Skills: [cast, protection]
    Schools: [restoration]
    GrantSkills:
      - { Skill: cast, Level: 1 }
      - { Skill: protection, Level: 1 }
    GrantSpells: [heal, tend]
    CompanionSpells:
      - { Spell: heal, Level: 1 }
      - { Spell: tend, Level: 1 } # Phase 30b: used by heal wounds, never by battle strategy
      - { Spell: healall, Level: 5 }
    Utility: [vigil]
    Growth:
      - { Stat: mysticism, Weight: 3 }
      - { Stat: vitality, Weight: 3 }
      - { Stat: smarts, Weight: 2 }
      - { Stat: strength, Weight: 2 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10015, 20004, 20008, 30004, 30015, 30001, 30001, 31]
  - ArchetypeId: ranger
    Name: Ranger
    Description: Trackers and pathfinders at home in the wild.
    Skills: [track]
    GrantSkills:
      - { Skill: track, Level: 1 }
    Utility: [trail, pathfinder, forage]
    Growth:
      - { Stat: perception, Weight: 4 }
      - { Stat: speed, Weight: 3 }
      - { Stat: strength, Weight: 2 }
      - { Stat: vitality, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10014, 20020, 20024, 20003, 30019, 30015, 23, 31]

# Phase 17b utility skills. A player's utility level is their level in the
# mapped skill (only if their archetype performs the utility); a
# companion's comes from its archetype's CompanionLevels.
Utilities:
  - { Utility: light, Skill: cast }
  - { Utility: traps, Skill: skulduggery }
  # Phase 33f2 expedition specialists.
  - { Utility: trail, Skill: track }
  - { Utility: pathfinder, Skill: track }
  - { Utility: keeneye, Skill: skulduggery }
  - { Utility: weather, Skill: cast }
  - { Utility: haggle, Skill: skulduggery }
  # Phase 33f3 camp specialists.
  - { Utility: watch, Skill: brawling }
  - { Utility: fieldsmith, Skill: brawling }
  - { Utility: vigil, Skill: protection }
  - { Utility: forage, Skill: track }

# Trap sense: best member's level * SensePerLevel + perception/4 must beat
# lock difficulty * SenseDifficultyFactor (a d100-style roll is added).
SensePerLevel: 20
SenseDifficultyFactor: 5
SenseCooldownRounds: 2
AutoSensePenalty: 20
# Trap disarm: same shape; failing by more than DisarmBackfireMargin
# springs the trap. A disarmed trap stays safe for DisarmRounds rounds.
DisarmPerLevel: 20
DisarmDifficultyFactor: 5
DisarmBackfireMargin: 25
DisarmRounds: 900
# Wizard auto-light: when a walking step leaves the walker's visibility
# below AutoLightBelow (1 = only in darkness) and no party light is up.
AutoLightSpell: floatinglight
AutoLightBelow: 1
AutoLightCooldown: 10
CompanionLightBuffID: 1000
CompanionLightManaCost: 10

# Phase 33f2 expedition specialists. Read the Trail reports enemy groups
# beyond the exits (two steps away from TrailFarLevel); bare "track" reads
# it on demand every TrailCooldownRounds. A tracker present when an ambush
# comes leads the company around it with AmbushEvadePerLevel% per level.
TrailFarLevel: 4
TrailCooldownRounds: 1
AmbushEvadePerLevel: 20
# Keen Eye: on entering a room, each unseen secret exit is spotted when
# level * KeenEyePerLevel + Perception/4 + d100 >= KeenEyeTarget.
KeenEyePerLevel: 20
KeenEyeTarget: 100
# Pathfinder (walking) and Haggle (market) numbers live in those modules.
