# Phase 17 archetypes (user decision 3: archetypes are exclusive).
#
# Each archetype claims skills and spell schools. Only archetypes that list
# a skill may train it (several may share one, like cast); only archetypes
# that list a spell school may learn its spells. Skills and schools no
# archetype claims are open to everyone ("trade skills").
#
# GrantSkills/GrantSpells are applied once when a player chooses the
# archetype (never lowering a higher level). CompanionLevels are the
# character levels at which a companion of this archetype reaches utility
# skill levels 1..4. Utility names the utility actions it performs.
# Kit (Phase 22a) is the starter kit's item ids, granted once into the
# backpack of a player who chooses the archetype; repeat an id to give two.
# Every kit includes a 10 kg cloth knapsack (item 38, Phase 34b).
# Unknown ids are dropped at load with a warning. Keep kit values balanced
# (the shipped-data test allows the largest total 1.25x the smallest).
# CompanionSpells (Phase 32d) are the spells a companion of the archetype
# knows from a character level, cast in battle by its strategy; each must
# be in the archetype's Schools (else it is dropped at load with a warning).
# GrantSpells reach existing characters too: they are applied at every login.
# Growth (Phase 33h1) weights a companion's stat points by stat (strength,
# speed, smarts, vitality, mysticism, perception); its training is always
# its level's points dealt by these weights, plus its own growth focus.
# (Lists, not maps: module config maps are flattened by the loader.)
# Phase 35a2 (skill over hit points): HPPerLevel is the health a level
# through HPFullLevels (a quarter of it after), from HPBase plus HPStart,
# a head start. AttackRate and EvasionRate are the Attack and Evasion
# gained a level. ArmorTraining is the heaviest armor bulk worn without
# penalty (light, medium, heavy). ShieldSizes are the shields it may carry
# (buckler, shield, tower; none for no shield; omitted for any).
# WeaponClasses are the weapon classes it may wield (omitted for any).
# Phase 35b: ManaBase and ManaPerLevel size a caster's mana pool (omitted:
# the progression defaults), which refills only through a rest, an inn or a
# draught. LevelSpells are spells a player of the archetype learns when a
# level-up first reaches the level (owning the spell is the marker; death
# never takes it back).
Archetypes:
  - ArchetypeId: warrior
    HPPerLevel: 1.0
    HPStart: 10
    AttackRate: 1.0
    EvasionRate: 1.0
    ArmorTraining: heavy
    ShieldSizes: [buckler, shield, tower]
    Name: Warrior
    Description: Frontline fighters who trust steel and grit.
    Skills: [brawling, dual-wield]
    GrantSkills:
      - { Skill: brawling, Level: 1 }
    Utility: [watch, fieldsmith]
    Growth:
      - { Stat: strength, Weight: 4 }
      - { Stat: vitality, Weight: 3 }
      - { Stat: speed, Weight: 2 }
      - { Stat: perception, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10002, 20004, 20020, 30004, 30015, 38]
  - ArchetypeId: rogue
    HPPerLevel: 0.7
    HPStart: 4
    AttackRate: 0.9
    EvasionRate: 1.1
    ArmorTraining: light
    ShieldSizes: [none]
    Name: Rogue
    Description: Quiet hands that find traps and open locks.
    Skills: [skulduggery]
    GrantSkills:
      - { Skill: skulduggery, Level: 1 }
    Utility: [traps, keeneye, haggle]
    Growth:
      - { Stat: speed, Weight: 4 }
      - { Stat: perception, Weight: 3 }
      - { Stat: strength, Weight: 2 }
      - { Stat: smarts, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10004, 8, 20029, 20003, 23, 30004, 30015, 38]
  - ArchetypeId: wizard
    HPPerLevel: 0.5
    HPStart: 0
    AttackRate: 0.7
    EvasionRate: 0.75
    ArmorTraining: light
    ShieldSizes: [none]
    ManaBase: 40
    ManaPerLevel: 10
    Name: Wizard
    Description: Scholars of the arcane who light the dark and bend illusion.
    Skills: [cast, enchant, scribe]
    Schools: [illusion, conjuration]
    GrantSkills:
      - { Skill: cast, Level: 1 }
    GrantSpells: [floatinglight, mm]
    LevelSpells:
      - { Spell: sparks, Level: 3 }
    CompanionSpells:
      - { Spell: mm, Level: 1 }
      - { Spell: sparks, Level: 3 }
    Utility: [light, weather]
    Growth:
      - { Stat: mysticism, Weight: 4 }
      - { Stat: smarts, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: speed, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # Phase 35b: one minor mana draught.
    Kit: [10021, 20020, 20008, 20039, 30004, 30015, 30014, 38]
  # Phase 38a: the control caster. Its hexes take enemy turns away instead of
  # dealing damage (internal/hexes); each hex reaches more foes as it levels.
  # Withering Hex is the weak damage curse it falls back on.
  - ArchetypeId: witch
    HPPerLevel: 0.55
    HPStart: 1
    AttackRate: 0.7
    EvasionRate: 0.75
    ArmorTraining: light
    ShieldSizes: [none]
    ManaBase: 40
    ManaPerLevel: 10
    Name: Witch
    Description: Hedge-craft casters who take enemy turns away with sleep, paralysis, snares and poison instead of dealing damage.
    Skills: [cast]
    Schools: [hexcraft]
    GrantSkills:
      - { Skill: cast, Level: 1 }
    GrantSpells: [slumber, hex]
    LevelSpells:
      - { Spell: earthbind, Level: 3 }
      - { Spell: leaden, Level: 5 }
      - { Spell: miasma, Level: 7 }
      - { Spell: binding, Level: 10 }
      - { Spell: frailty, Level: 12 }
      - { Spell: dread, Level: 15 }
      - { Spell: blight, Level: 18 }
    CompanionSpells:
      - { Spell: slumber, Level: 1 }
      - { Spell: hex, Level: 1 }
      - { Spell: earthbind, Level: 3 }
      - { Spell: leaden, Level: 5 }
      - { Spell: miasma, Level: 7 }
      - { Spell: binding, Level: 10 }
      - { Spell: frailty, Level: 12 }
      - { Spell: dread, Level: 15 }
      - { Spell: blight, Level: 18 }
    Utility: [weather]
    Growth:
      - { Stat: mysticism, Weight: 4 }
      - { Stat: smarts, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: vitality, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # An ash staff, a hooded robe, and one minor mana draught.
    Kit: [10021, 20020, 20008, 20039, 30004, 30015, 30014, 38]
  # Phase 39a: the glaive class, neutral from the start (neutral classes
  # design). Two hands on a polearm, so no shield; Sweep strikes a row and
  # Brace answers the first blow (internal/hooks/combat_halberd.go).
  - ArchetypeId: halberdier
    HPPerLevel: 0.9
    HPStart: 7
    AttackRate: 1.0
    EvasionRate: 0.9
    ArmorTraining: medium
    ShieldSizes: [none]
    WeaponClasses: [glaive, spear]
    Name: Halberdier
    Description: Polearm fighters who sweep a row of foes with a glaive and brace to meet the first blow, at home in the front or middle row and tied to no side.
    Skills: [polearm]
    GrantSkills:
      - { Skill: polearm, Level: 1 }
    Growth:
      - { Stat: strength, Weight: 4 }
      - { Stat: vitality, Weight: 3 }
      - { Stat: speed, Weight: 2 }
      - { Stat: perception, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # A militia glaive, a padded tunic and leggings, rations and a waterskin.
    Kit: [10151, 20103, 20109, 30004, 30015, 38]
  # Phase 39f: the skirmisher, a neutral lineage (no alignment gate at 10 or
  # 30). Dive passes the front row onto the rows behind, from open sky only
  # (internal/hooks/combat_gryphon.go); a buckler and medium armor.
  - ArchetypeId: gryphon-rider
    HPPerLevel: 0.8
    HPStart: 5
    AttackRate: 1.0
    EvasionRate: 1.0
    ArmorTraining: medium
    ShieldSizes: [buckler]
    WeaponClasses: [spear, sword]
    Name: Gryphon Rider
    Description: Skirmishers who dive from the sky past the front line onto the healers and casters behind it, then fight on with a spear or sword; no creed, no alignment gate on their routes.
    Skills: [skirmish]
    GrantSkills:
      - { Skill: skirmish, Level: 1 }
    Utility: [keeneye]
    Growth:
      - { Stat: speed, Weight: 4 }
      - { Stat: strength, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: vitality, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # An iron short spear, a leather buckler, a padded jack, a leather cap and worn boots.
    Kit: [10131, 20047, 20163, 20020, 20003, 30004, 30015, 38]
  # Phase 39b: the duelist, a neutral lineage (no alignment gate at 10 or 30).
  # Its first strike each battle is its best (Iaijutsu, internal/classes);
  # medium armor and no shield make it an ordinary front-liner after that.
  - ArchetypeId: samurai
    HPPerLevel: 0.85
    HPStart: 6
    AttackRate: 1.0
    EvasionRate: 1.0
    ArmorTraining: medium
    ShieldSizes: [none]
    WeaponClasses: [sword]
    Name: Samurai
    Description: Duelists who open a fight half a turn ahead with a hard first strike, then fight on in medium armor with a sword; no creed, no shield, no alignment gate on their routes.
    Skills: [brawling]
    GrantSkills:
      - { Skill: brawling, Level: 1 }
    Utility: [watch]
    Growth:
      - { Stat: speed, Weight: 4 }
      - { Stat: strength, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: smarts, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # An iron shortsword, a padded jack, a leather cap and worn boots.
    Kit: [10101, 20163, 20020, 20003, 30004, 30015, 38]
  # Phase 39d: the puppet class, neutral from the start. The Master spends no
  # mana: it drives a wooden doll that stands in a cell of its own and strikes
  # on the Master's turn (internal/dolls, internal/hooks/combat_doll.go).
  - ArchetypeId: dollmaster
    HPPerLevel: 0.55
    HPStart: 1
    AttackRate: 0.7
    EvasionRate: 0.8
    ArmorTraining: light
    ShieldSizes: [none]
    WeaponClasses: [dagger, rod, staff]
    Name: Doll Master
    Description: Puppeteers who fight through a wooden doll that stands in the front line and strikes on their turn, guard their wounded with strings, and mend the doll at camp from doll parts; no mana, no creed, no alignment gate on their routes.
    Skills: [puppetry]
    GrantSkills:
      - { Skill: puppetry, Level: 1 }
    Growth:
      - { Stat: smarts, Weight: 4 }
      - { Stat: perception, Weight: 3 }
      - { Stat: speed, Weight: 2 }
      - { Stat: mysticism, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # A plain dagger, a cotton shirt, a leather cap, worn boots, two doll parts.
    Kit: [10004, 20008, 20020, 20003, 30004, 30015, 70, 70, 38]
  # Phase 39c: the weather caster, a neutral lineage (no alignment gate at 10
  # or 30). It calls a battle-local weather (internal/stormcraft, battle
  # state) that changes both sides' odds, then casts wind and lightning; it
  # casts as a wizard does (role caster) and uses mana.
  - ArchetypeId: shaman
    HPPerLevel: 0.5
    HPStart: 0
    AttackRate: 0.7
    EvasionRate: 0.75
    ArmorTraining: light
    ShieldSizes: [none]
    ManaBase: 40
    ManaPerLevel: 10
    Name: Shaman
    Description: Weather-callers who bring fog, a cold wind and rain into a battle to tilt the odds, then answer with wind and lightning; no creed, no alignment gate on their routes.
    Skills: [cast]
    Schools: [stormcraft]
    GrantSkills:
      - { Skill: cast, Level: 1 }
    GrantSpells: [callfog, gust]
    LevelSpells:
      - { Spell: chillwind, Level: 3 }
      - { Spell: rain, Level: 6 }
      - { Spell: lightning, Level: 8 }
    CompanionSpells:
      - { Spell: callfog, Level: 1 }
      - { Spell: gust, Level: 1 }
      - { Spell: chillwind, Level: 3 }
      - { Spell: rain, Level: 6 }
      - { Spell: lightning, Level: 8 }
    Utility: [weather]
    Growth:
      - { Stat: mysticism, Weight: 4 }
      - { Stat: smarts, Weight: 3 }
      - { Stat: perception, Weight: 2 }
      - { Stat: speed, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    # An ash staff, a hooded robe, and one minor mana draught.
    Kit: [10021, 20020, 20008, 20039, 30004, 30015, 30014, 38]
  - ArchetypeId: cleric
    HPPerLevel: 0.6
    HPStart: 2
    AttackRate: 0.7
    EvasionRate: 0.75
    ArmorTraining: light
    ShieldSizes: [none]
    WeaponClasses: [staff, rod, mace]
    ManaBase: 36
    ManaPerLevel: 9
    Name: Cleric
    Description: Healers and protectors sworn to keep the company standing, with staff, rod or mace.
    Skills: [cast, protection, scribe]
    Schools: [restoration]
    GrantSkills:
      - { Skill: cast, Level: 1 }
      - { Skill: protection, Level: 1 }
    GrantSpells: [heal, tend]
    LevelSpells:
      - { Spell: healall, Level: 3 }
      - { Spell: curepoison, Level: 6 } # Phase 38b
      - { Spell: bless, Level: 8 }
    CompanionSpells:
      - { Spell: heal, Level: 1 }
      - { Spell: tend, Level: 1 } # Phase 30b: used by heal wounds, never by battle strategy
      - { Spell: healall, Level: 3 }
      - { Spell: bless, Level: 8 } # Phase 38b: cast while no one needs healing
    Utility: [vigil]
    Growth:
      - { Stat: mysticism, Weight: 3 }
      - { Stat: vitality, Weight: 3 }
      - { Stat: smarts, Weight: 2 }
      - { Stat: strength, Weight: 2 }
    CompanionLevels: [1, 10, 20, 30]
    # Phase 35a2: an acolyte's mace and a holy symbol (+5% healing).
    Kit: [10023, 20046, 20008, 30004, 30015, 30001, 30001, 38]
  - ArchetypeId: ranger
    HPPerLevel: 0.8
    HPStart: 6
    AttackRate: 1.0
    EvasionRate: 0.9
    ArmorTraining: medium
    ShieldSizes: [buckler]
    Name: Ranger
    Description: Trackers and pathfinders at home in the wild.
    Skills: [track]
    GrantSkills:
      - { Skill: track, Level: 1 }
    Utility: [trail, pathfinder, forage]
    Growth:
      - { Stat: perception, Weight: 4 }
      - { Stat: speed, Weight: 3 }
      - { Stat: strength, Weight: 2 }
      - { Stat: vitality, Weight: 1 }
    CompanionLevels: [1, 10, 20, 30]
    Kit: [10014, 20020, 20024, 20003, 30019, 30015, 23, 38]

# Phase 35c optional skills: the only skills a companion can be trained in
# ("company train"), with training points earned by level. Class skills and
# specialists stay automatic. Archetypes lists who may learn one ("*" is
# everyone); MaxRank caps a companion's rank (1..4). Scribe (36a) is for casters.
OptionalSkills:
  - { Skill: cooking, Archetypes: ["*"], MaxRank: 4 }
  - { Skill: scribe, Archetypes: [wizard, cleric], MaxRank: 4 }

# Phase 17b utility skills. A player's utility level is their level in the
# mapped skill (only if their archetype performs the utility); a
# companion's comes from its archetype's CompanionLevels.
Utilities:
  - { Utility: light, Skill: cast }
  # Phase 36a: reads unidentified gear at a camp rest (autoskill scribe).
  - { Utility: scribe, Skill: scribe }
  - { Utility: traps, Skill: skulduggery }
  # Phase 33f2 expedition specialists.
  - { Utility: trail, Skill: track }
  - { Utility: pathfinder, Skill: track }
  - { Utility: keeneye, Skill: skulduggery }
  - { Utility: weather, Skill: cast }
  - { Utility: haggle, Skill: skulduggery }
  # Phase 33f3 camp specialists.
  - { Utility: watch, Skill: brawling }
  - { Utility: fieldsmith, Skill: brawling }
  - { Utility: vigil, Skill: protection }
  - { Utility: forage, Skill: track }

# Trap sense: best member's level * SensePerLevel + perception/4 must beat
# lock difficulty * SenseDifficultyFactor (a d100-style roll is added).
SensePerLevel: 20
SenseDifficultyFactor: 5
SenseCooldownRounds: 2
AutoSensePenalty: 20
# Trap disarm: same shape; failing by more than DisarmBackfireMargin
# springs the trap. A disarmed trap stays safe for DisarmRounds rounds.
DisarmPerLevel: 20
DisarmDifficultyFactor: 5
DisarmBackfireMargin: 25
DisarmRounds: 900
# Wizard auto-light: when a walking step leaves the walker's visibility
# below AutoLightBelow (1 = only in darkness) and no party light is up.
AutoLightSpell: floatinglight
AutoLightBelow: 1
AutoLightCooldown: 10
CompanionLightBuffID: 1000
CompanionLightManaCost: 10

# Phase 33f2 expedition specialists. Read the Trail reports enemy groups
# beyond the exits (two steps away from TrailFarLevel); bare "track" reads
# it on demand every TrailCooldownRounds. A tracker present when an ambush
# comes leads the company around it with AmbushEvadePerLevel% per level.
TrailFarLevel: 4
TrailCooldownRounds: 1
AmbushEvadePerLevel: 20
# Keen Eye: on entering a room, each unseen secret exit is spotted when
# level * KeenEyePerLevel + Perception/4 + d100 >= KeenEyeTarget.
KeenEyePerLevel: 20
KeenEyeTarget: 100
# Pathfinder (walking) and Haggle (market) numbers live in those modules.
