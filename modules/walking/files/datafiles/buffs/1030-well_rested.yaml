# Phase 16 Well Rested, granted by modules/camping when a company wakes
# from an inn stay: the leader and every spawned companion. Its
# well-rested flag halves walking strain (modules/walking). About 30
# minutes (450 rounds; modules/camping overrides the count with its
# WellRestedDuration). The only buff named Well Rested: upstream buff 16,
# which a nap grants, was renamed Refreshed in Phase 23a. Granting it
# removes the weaker camp tier, Rested (1033).
buffid: 1030
name: Well Rested
description: A proper bed has left you refreshed; the road feels lighter.
secret: false
triggerrate: 1 round
triggercount: 450
flags:
  - well-rested
statmods:
  perception: 2
  speed: 2
