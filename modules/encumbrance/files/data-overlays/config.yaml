# Phase 9 encumbrance capacity and load-modifier bands.
#
# Phase 32f: capacity comes from the members. Each member (the leader and
# every living companion not charmed away) carries MemberBaseKg, plus
# StrengthKg per point of Strength, plus their largest pack's carrybonus
# (item data). The horses add theirs (modules/mount). A full company takes
# on nothing more: get, buy, and gifts are refused past capacity. The old
# flat CapacityKg is retired and ignored. LoadBands maps load ratio thresholds to
# travel-duration/fatigue percentage modifiers; the implicit band below the
# lowest MinRatio is always 100%/100% (unchanged). Phase 16 applies them:
# TravelDurationPct and FatiguePct are locked onto a route journey at
# departure, and FatiguePct scales every walking step's strain.
MemberBaseKg: 20
StrengthKg: 0.5
LoadBands:
  - MinRatio: 0.75
    TravelDurationPct: 110
    FatiguePct: 108
  - MinRatio: 0.9
    TravelDurationPct: 125
    FatiguePct: 115
  - MinRatio: 1.0
    TravelDurationPct: 150
    FatiguePct: 130
