# Phase 36a loot affixes (docs/designs/2026-10-05-loot-system-design.md).
# Each affix maps onto a mechanic that already exists. Tiers rise with item
# level (minilvl); one affix per group per item. Hit, crit, block and dodge
# chances, status-on-crit, resists, spell power, chant-break resistance and
# the Epic mechanics (cleaving, vampiric, warded, echoing) join with the
# systems that read them.
affixes:
  - id: strength
    group: stat-strength
    prefix: Mighty
    suffix: of the Bear
    mechanic: statmod:strength
    slots: [weapon, shield, armor, jewelry]
    tiers:
      - { minilvl: 1, min: 1, max: 2 }
      - { minilvl: 15, min: 2, max: 3 }
      - { minilvl: 30, min: 3, max: 5 }
      - { minilvl: 45, min: 5, max: 7 }
      - { minilvl: 60, min: 7, max: 9 }
    weight: 10
