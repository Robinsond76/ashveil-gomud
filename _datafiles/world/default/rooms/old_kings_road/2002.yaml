zone: Old Kings Road
title: Fork at the Black Oak
description: An enormous black oak dominates the fork where the Old King's Road
  splits and vanishes into the deep forest. The tree was split by lightning long ago;
  its scorched trunk gapes open, and the two halves still reach skyward, black against
  the green. Pines crowd close on every side, their needles carpeting the ground in
  rust-brown drifts, and the air is cool and still beneath the canopy. A mossy waystone
  leans at the base of the oak, its lettering long since weathered away, marking where
  travelers once chose between the two forest tracks. Beside the oak, a trodden
  footpath leads east to a trappers' clearing, and the smell of woodsmoke and
  curing hides drifts back along it. A second, narrower path winds west through the
  bracken toward the hamlet of Fernhollow.
