zone: Dunmar
title: Dunmar Market Square
description: A cobbled square opens east of the west gate, hemmed in by tall timber
  houses whose upper storeys lean out over the stalls below. Trestle tables and
  canvas awnings crowd every foot of it. A tanner's stall is hung with stiff wolf
  hides, a butcher's block is loud with flies and cleavers, and an old woman sells
  bundled herbs from a barrow. Criers shout the day's prices over the din, and a
  chalked board by the well tracks what the town is short of and what it has too
  much of. A reeking alley runs south behind the tanner's stall, and a small
  stone chapel stands at the square's east end.
