zone: Fernhollow
title: Fernhollow Green
description: A handful of turf-roofed cottages huddle around a green worn bare by
  geese and children, in a hollow where bracken grows shoulder-high. Smoke seeps
  from the thatch rather than rising from any chimney, and a rain barrel stands at
  every door. A stone trough fed by a spring marks the middle of the green. To the
  west, at the edge of the trees, stands a round lodge hung with antlers and bundles
  of drying herbs, where the hamlet's shaman keeps her fire. The track back to the
  Black Oak runs east.
