zone: Fernhollow
title: The Shaman's Lodge
description: The round lodge is dim and close, its walls of woven hazel daubed with
  clay and hung with antlers, feathers, and bundles of sage and yarrow drying in the
  smoke. A peat fire smoulders in a ring of hearthstones at the centre, and the
  smoke finds its own way out through a gap in the thatch. Bones and river stones
  lie arranged on a hide beside the fire, and a low bed of fresh rushes waits along
  the far wall for whoever the shaman is called to mend. The door of the lodge opens
  east onto the green.
