title: The Waking Hall
description: A long, low hall of whitewashed timber, where new arrivals wake on
  straw pallets under a row of shuttered windows. A slate by the door lists the
  things every traveller should know about themselves before setting out -- their
  health and hunger, what they carry, how far they have come, and what ails them.
  A door stands in the east wall, barred until you have taken stock. (Type
  "tutorial" at any time for your current lesson.)
