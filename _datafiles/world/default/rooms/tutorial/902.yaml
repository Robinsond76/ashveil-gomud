zone: Tutorial
title: The Drill Ground
description: A square of trampled grass marked out with chalk into a three-by-three
  grid -- a front rank, a middle rank, and a rear. Here a company learns its
  formation, which says who stands in harm's way and who is sheltered behind them.
  The grid is a battle order, not a map. The way east opens once one companion
  holds the front rank and another stands behind. The yard lies back to the west.
