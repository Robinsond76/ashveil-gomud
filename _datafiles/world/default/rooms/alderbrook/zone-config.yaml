            count: 2
      - id: stray-dogs
        weight: 20
        text: Half-starved junkyard dogs bark and charge down the lane.
        members:
          - mobid: 31
            count: 3
      - id: road-brigands
        weight: 15
        text: Road brigands step out of the hedge with their blades drawn.
        members:
          - mobid: 86
            count: 2
      - id: poacher-trio
        weight: 10
        text: A trio of poachers, a bonesetter among them, hails the company from the field edge.
        members:
