      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> wraps <ansi fg="{targettype}">{target}</ansi>''s throat, and you haul it tight.'
      - 'Your lash splits <ansi fg="{targettype}">{target}</ansi>''s brow to the bone.'
      - 'Your <ansi fg="item">{itemname}</ansi> flays <ansi fg="{targettype}">{target}</ansi>''s back open in a spray of blood.'
