      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash falls short of <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{targettype}">{target}</ansi> steps back, and <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slaps the ground.'
  weak:
    together:
