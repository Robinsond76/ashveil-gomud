      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash wraps <ansi fg="{targettype}">{target}</ansi>''s arm and bites as it pulls free.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> opens a long red stripe across <ansi fg="{targettype}">{target}</ansi>''s chest.'
