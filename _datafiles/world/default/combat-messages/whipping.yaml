      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash coils around your leg and nearly rips it out from under you.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> cuts you across the face, and blood runs freely.'
