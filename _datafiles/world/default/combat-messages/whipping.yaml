      - 'The tip of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> flicks a welt onto <ansi fg="{targettype}">{target}</ansi>''s cheek.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> snaps against <ansi fg="{targettype}">{target}</ansi>''s shin.'
  normal:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> cracks across <ansi fg="{targettype}">{target}</ansi>''s back and splits the skin.'
      - 'Your lash wraps <ansi fg="{targettype}">{target}</ansi>''s arm and bites as it pulls free.'
      - 'Your <ansi fg="item">{itemname}</ansi> opens a long red stripe across <ansi fg="{targettype}">{target}</ansi>''s chest.'
      todefender:
