      - 'The tip of your <ansi fg="item">{itemname}</ansi> flicks a welt onto <ansi fg="{targettype}">{target}</ansi>''s cheek.'
      - 'Your <ansi fg="item">{itemname}</ansi> snaps against <ansi fg="{targettype}">{target}</ansi>''s shin.'
      todefender:
