# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: whipping
options:
  prepare:
    together:
      toattacker:
      - 'You let your <ansi fg="item">{itemname}</ansi> uncoil at your feet and watch <ansi fg="{targettype}">{target}</ansi>.'
      - 'You snap your <ansi fg="item">{itemname}</ansi> once, a warning, at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You shake out your <ansi fg="item">{itemname}</ansi> and step toward <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> uncoils in the dirt, and <ansi fg="{sourcetype}">{source}</ansi> watches you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> snaps the <ansi fg="item">{itemname}</ansi> once at you, a warning.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shakes out the <ansi fg="item">{itemname}</ansi> and steps toward you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> uncoils in the dirt, and <ansi fg="{sourcetype}">{source}</ansi> watches <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> snaps the <ansi fg="item">{itemname}</ansi> once at <ansi fg="{targettype}">{target}</ansi>, a warning.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shakes out the <ansi fg="item">{itemname}</ansi> and steps toward <ansi fg="{targettype}">{target}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You circle <ansi fg="{targettype}">{target}</ansi>, the <ansi fg="item">{itemname}</ansi> trailing behind you.'
      - 'You flick your <ansi fg="item">{itemname}</ansi> idly, waiting for <ansi fg="{targettype}">{target}</ansi> to move.'
      - 'You watch <ansi fg="{targettype}">{target}</ansi> and let the <ansi fg="item">{itemname}</ansi> hiss through the grass.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles you, the <ansi fg="item">{itemname}</ansi> trailing behind.'
      - '<ansi fg="{sourcetype}">{source}</ansi> flicks the <ansi fg="item">{itemname}</ansi> idly, waiting for you to move.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> hisses through the grass at your feet.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles <ansi fg="{targettype}">{target}</ansi>, the <ansi fg="item">{itemname}</ansi> trailing behind.'
      - '<ansi fg="{sourcetype}">{source}</ansi> flicks the <ansi fg="item">{itemname}</ansi> idly, waiting for <ansi fg="{targettype}">{target}</ansi> to move.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> hisses through the grass at <ansi fg="{targettype}">{target}</ansi>''s feet.'
  miss:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> cracks in the air beside <ansi fg="{targettype}">{target}</ansi>''s ear.'
      - 'Your lash falls short of <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{targettype}">{target}</ansi> steps back, and your <ansi fg="item">{itemname}</ansi> slaps the ground.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> cracks in the air beside your ear.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash falls short of you.'
      - 'You step back, and <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slaps the ground.'
