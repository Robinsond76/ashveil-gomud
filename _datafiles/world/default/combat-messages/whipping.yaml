      - 'The tip of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> flicks a welt onto your cheek.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> snaps against your shin.'
