      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash splits your brow to the bone.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> flays your back open in a spray of blood.'
