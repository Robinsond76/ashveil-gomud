      - '<ansi fg="{sourcetype}">{source}</ansi>''s lash coils around <ansi fg="{targettype}">{target}</ansi>''s leg and rips it out from under.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> cuts <ansi fg="{targettype}">{target}</ansi> across the face, and blood runs freely.'
