      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> tears a strip of flesh from <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - 'Your lash coils around <ansi fg="{targettype}">{target}</ansi>''s leg and rips it out from under.'
      - 'Your <ansi fg="item">{itemname}</ansi> cuts <ansi fg="{targettype}">{target}</ansi> across the face, and blood runs freely.'
