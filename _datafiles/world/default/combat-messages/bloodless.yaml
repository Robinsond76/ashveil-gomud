# Phase 87: what a blow does to a foe with no blood and no living flesh
# (races marked bloodless: undead, golems, dolls, orbs, spirits). Used for
# every weapon in place of its hit lines; its prepare, wait and miss lines
# are still the weapon's own. Same voice as the weapon files: dark and
# physical, no exclamation marks, write names bare.
optionid: bloodless
options:
  weak:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> chips a shard from <ansi fg="{targettype}">{target}</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> scrapes across <ansi fg="{targettype}">{target}</ansi>''s hollow frame.'
      - 'You knock a loose piece off <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> chips a shard from you.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> scrapes across your hollow frame.'
      - '<ansi fg="{sourcetype}">{source}</ansi> knocks a loose piece off you.'
