# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: cleaving
options:
  prepare:
    together:
      toattacker:
      - 'You heft your <ansi fg="item">{itemname}</ansi> and fix your eyes on <ansi fg="{targettype}">{target}</ansi>.'
      - 'You draw your <ansi fg="item">{itemname}</ansi> back over your shoulder, watching <ansi fg="{targettype}">{target}</ansi>.'
      - 'You plant your feet and let the weight of your <ansi fg="item">{itemname}</ansi> settle.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> hefts a heavy blade and fixes you with a flat stare.'
      - '<ansi fg="{sourcetype}">{source}</ansi> draws the <ansi fg="item">{itemname}</ansi> back over one shoulder, watching you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> plants both feet, and the weight of the <ansi fg="item">{itemname}</ansi> settles.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> hefts a heavy blade and fixes <ansi fg="{targettype}">{target}</ansi> with a flat stare.'
      - '<ansi fg="{sourcetype}">{source}</ansi> draws the <ansi fg="item">{itemname}</ansi> back over one shoulder, watching <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> plants both feet in front of <ansi fg="{targettype}">{target}</ansi>, and the weight of the <ansi fg="item">{itemname}</ansi> settles.'
  wait:
    together:
      toattacker:
      - 'You rock your <ansi fg="item">{itemname}</ansi> from hand to hand, eyes on <ansi fg="{targettype}">{target}</ansi>.'
      - 'You wait for <ansi fg="{targettype}">{target}</ansi> to come within reach.'
      - 'You breathe, heavy and slow, and hold the <ansi fg="item">{itemname}</ansi> ready.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> rocks the <ansi fg="item">{itemname}</ansi> from hand to hand, eyes on you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> waits for you to come within reach.'
      - '<ansi fg="{sourcetype}">{source}</ansi> breathes heavy and slow and holds the <ansi fg="item">{itemname}</ansi> ready.'
      toroom:
