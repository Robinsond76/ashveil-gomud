  miss:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> buries itself in the ground beside <ansi fg="{targettype}">{target}</ansi>.'
      - 'Your chop at <ansi fg="{targettype}">{target}</ansi> cleaves only air.'
      - '<ansi fg="{targettype}">{target}</ansi> leans back, and your <ansi fg="item">{itemname}</ansi> sweeps past.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> buries itself in the ground beside you.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s chop at you cleaves only air.'
      - 'You lean back, and <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> sweeps past.'
