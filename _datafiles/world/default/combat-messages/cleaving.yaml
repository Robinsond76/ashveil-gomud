      - 'Your <ansi fg="item">{itemname}</ansi> glances off <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - 'You clip <ansi fg="{targettype}">{target}</ansi>''s hip with the haft of your <ansi fg="item">{itemname}</ansi>.'
