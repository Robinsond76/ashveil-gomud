      - 'Your <ansi fg="item">{itemname}</ansi> comes down on <ansi fg="{targettype}">{target}</ansi>''s collarbone and splits it to the chest.'
      - 'You hew into <ansi fg="{targettype}">{target}</ansi>''s neck, and the <ansi fg="item">{itemname}</ansi> lodges in bone.'
      - 'Your <ansi fg="item">{itemname}</ansi> cleaves into <ansi fg="{targettype}">{target}</ansi>''s side, and blood spills over the haft.'
