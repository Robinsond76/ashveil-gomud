      - '<ansi fg="{sourcetype}">{source}</ansi> holds aim on <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> tracks <ansi fg="{targettype}">{target}</ansi> along the <ansi fg="item">{itemname}</ansi>.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You hold your aim through the <ansi fg="exit">{exitname}</ansi>, waiting for a clear shot at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You track <ansi fg="{targettype}">{target}</ansi> beyond the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'Someone to the <ansi fg="exit">{entrancename}</ansi> is waiting for a clear shot at you.'
      - 'You are being tracked from the <ansi fg="exit">{entrancename}</ansi>.'
