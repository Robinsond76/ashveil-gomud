      - '<ansi fg="{sourcetype}">{source}</ansi> holds aim through the <ansi fg="exit">{exitname}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> tracks something beyond the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'Someone to the <ansi fg="exit">{entrancename}</ansi> is waiting for a clear shot.'
      - 'Something to the <ansi fg="exit">{entrancename}</ansi> is tracking this room.'
  miss:
    together:
      toattacker:
      - 'Your shot hisses past <ansi fg="{targettype}">{target}</ansi>.'
      - 'Your shot flies wide of <ansi fg="{targettype}">{target}</ansi> and skitters away.'
      - '<ansi fg="{targettype}">{target}</ansi> moves as you loose, and the shot goes astray.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s shot hisses past you.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s shot flies wide of you and skitters away.'
      - 'You move as <ansi fg="{sourcetype}">{source}</ansi> looses, and the shot goes astray.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s shot hisses past <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s shot flies wide of <ansi fg="{targettype}">{target}</ansi> and skitters away.'
      - '<ansi fg="{targettype}">{target}</ansi> moves as <ansi fg="{sourcetype}">{source}</ansi> looses, and the shot goes astray.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your shot through the <ansi fg="exit">{exitname}</ansi> misses <ansi fg="{targettype}">{target}</ansi>.'
      - 'Your shot through the <ansi fg="exit">{exitname}</ansi> flies wide.'
      todefender:
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> hisses past you.'
      - 'A shot flies in from the <ansi fg="exit">{entrancename}</ansi> and goes wide of you.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> looses through the <ansi fg="exit">{exitname}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> looses through the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> hisses past <ansi fg="{targettype}">{target}</ansi>.'
      - 'A shot flies in from the <ansi fg="exit">{entrancename}</ansi> and goes wide of <ansi fg="{targettype}">{target}</ansi>.'
