# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: shooting
options:
  prepare:
    together:
      toattacker:
      - 'You nock and draw, sighting on <ansi fg="{targettype}">{target}</ansi>.'
      - 'You set a shot to your <ansi fg="item">{itemname}</ansi> and take aim at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You settle your breathing and find <ansi fg="{targettype}">{target}</ansi> along your <ansi fg="item">{itemname}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> draws and sights on you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> sets a shot to the <ansi fg="item">{itemname}</ansi> and takes aim at you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> goes still, sighting on you along the <ansi fg="item">{itemname}</ansi>.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> draws and sights on <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> sets a shot to the <ansi fg="item">{itemname}</ansi> and takes aim at <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> goes still, sighting on <ansi fg="{targettype}">{target}</ansi> along the <ansi fg="item">{itemname}</ansi>.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You aim your <ansi fg="item">{itemname}</ansi> through the <ansi fg="exit">{exitname}</ansi> at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You find <ansi fg="{targettype}">{target}</ansi> beyond the <ansi fg="exit">{exitname}</ansi> and draw.'
      todefender:
      - 'Someone is taking aim at you from the <ansi fg="exit">{entrancename}</ansi>.'
      - 'You feel a sight settle on you from the <ansi fg="exit">{entrancename}</ansi>.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> aims the <ansi fg="item">{itemname}</ansi> through the <ansi fg="exit">{exitname}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> draws and sights through the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'Someone is taking aim into this room from the <ansi fg="exit">{entrancename}</ansi>.'
      - 'A bowstring creaks somewhere to the <ansi fg="exit">{entrancename}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You draw a slow breath and wait for a clear shot at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You hold your aim on <ansi fg="{targettype}">{target}</ansi>.'
      - 'You track <ansi fg="{targettype}">{target}</ansi> along your <ansi fg="item">{itemname}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> draws a slow breath and waits for a clear shot at you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> holds aim on you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> tracks you along the <ansi fg="item">{itemname}</ansi>.'
      toroom:
