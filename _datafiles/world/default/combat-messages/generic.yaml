# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: generic
options:
  prepare:
    together:
      toattacker:
      - 'You square up to <ansi fg="{targettype}">{target}</ansi>.'
      - 'You raise your <ansi fg="item">{itemname}</ansi> and step toward <ansi fg="{targettype}">{target}</ansi>.'
      - 'You lock eyes with <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> squares up to you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> raises a guard and steps toward you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> locks eyes with you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> squares up to <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> raises a guard and steps toward <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> locks eyes with <ansi fg="{targettype}">{target}</ansi>.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You ready your <ansi fg="item">{itemname}</ansi> toward the <ansi fg="exit">{exitname}</ansi>, where <ansi fg="{targettype}">{target}</ansi> stands.'
      todefender:
      - 'Something stirs to the <ansi fg="exit">{entrancename}</ansi>. You are being watched.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> readies the <ansi fg="item">{itemname}</ansi> toward the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A cold stillness settles over the room from the <ansi fg="exit">{entrancename}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You circle <ansi fg="{targettype}">{target}</ansi>, looking for an opening.'
      - 'You draw a slow breath and wait for <ansi fg="{targettype}">{target}</ansi> to move.'
      - 'You shift your weight and watch <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles you, looking for an opening.'
      - '<ansi fg="{sourcetype}">{source}</ansi> waits, breathing slow, for you to move.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shifts weight and watches you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles <ansi fg="{targettype}">{target}</ansi>, looking for an opening.'
      - '<ansi fg="{sourcetype}">{source}</ansi> waits, breathing slow, for <ansi fg="{targettype}">{target}</ansi> to move.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shifts weight and watches <ansi fg="{targettype}">{target}</ansi>.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You wait for <ansi fg="{targettype}">{target}</ansi> to show through the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'Someone waits for you, to the <ansi fg="exit">{entrancename}</ansi>.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> waits, watching the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'Something watches this room from the <ansi fg="exit">{entrancename}</ansi>.'
  miss:
    together:
      toattacker:
      - 'Your swing at <ansi fg="{targettype}">{target}</ansi> goes wide.'
      - 'You strike at <ansi fg="{targettype}">{target}</ansi> and hit nothing.'
      - '<ansi fg="{targettype}">{target}</ansi> sways aside, and your blow falls on empty air.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s swing at you goes wide.'
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes at you and hits nothing.'
      - 'You sway aside, and <ansi fg="{sourcetype}">{source}</ansi>''s blow falls on empty air.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s swing at <ansi fg="{targettype}">{target}</ansi> goes wide.'
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes at <ansi fg="{targettype}">{target}</ansi> and hits nothing.'
      - '<ansi fg="{targettype}">{target}</ansi> sways aside, and <ansi fg="{sourcetype}">{source}</ansi>''s blow falls on empty air.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack through the <ansi fg="exit">{exitname}</ansi> misses <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - 'Something flies in from the <ansi fg="exit">{entrancename}</ansi> and misses you.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes toward the <ansi fg="exit">{exitname}</ansi> and misses.'
      todefenderroom:
      - 'Something flies in from the <ansi fg="exit">{entrancename}</ansi> and misses <ansi fg="{targettype}">{target}</ansi>.'
  weak:
    together:
      toattacker:
      - 'You clip <ansi fg="{targettype}">{target}</ansi> on the arm with your <ansi fg="item">{itemname}</ansi>.'
      - 'Your blow glances off <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - 'You catch <ansi fg="{targettype}">{target}</ansi> a glancing blow across the cheek.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> clips you on the arm.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow glances off your shoulder.'
      - '<ansi fg="{sourcetype}">{source}</ansi> catches you a glancing blow across the cheek.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> clips <ansi fg="{targettype}">{target}</ansi> on the arm.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow glances off <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - '<ansi fg="{sourcetype}">{source}</ansi> catches <ansi fg="{targettype}">{target}</ansi> a glancing blow across the cheek.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack through the <ansi fg="exit">{exitname}</ansi> grazes <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> grazes you.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes toward the <ansi fg="exit">{exitname}</ansi> and grazes something.'
      todefenderroom:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> grazes <ansi fg="{targettype}">{target}</ansi>.'
  normal:
    together:
      toattacker:
      - 'You strike <ansi fg="{targettype}">{target}</ansi> hard in the ribs with your <ansi fg="item">{itemname}</ansi>.'
      - 'Your blow lands square on <ansi fg="{targettype}">{target}</ansi>''s jaw.'
      - 'You drive your <ansi fg="item">{itemname}</ansi> into <ansi fg="{targettype}">{target}</ansi>''s gut.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes you hard in the ribs.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow lands square on your jaw.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow drives into your gut.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes <ansi fg="{targettype}">{target}</ansi> hard in the ribs.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow lands square on <ansi fg="{targettype}">{target}</ansi>''s jaw.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow drives into <ansi fg="{targettype}">{target}</ansi>''s gut.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack through the <ansi fg="exit">{exitname}</ansi> strikes <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> strikes you hard.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes toward the <ansi fg="exit">{exitname}</ansi>, and something is hit.'
      todefenderroom:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> strikes <ansi fg="{targettype}">{target}</ansi> hard.'
  heavy:
    together:
      toattacker:
      - 'You hammer <ansi fg="{targettype}">{target}</ansi> across the face, and <ansi fg="{targettype}">{target}</ansi> reels.'
      - 'Your blow folds <ansi fg="{targettype}">{target}</ansi> over, gasping.'
      - 'You drive your <ansi fg="item">{itemname}</ansi> into <ansi fg="{targettype}">{target}</ansi>''s chest, and something cracks.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> hammers you across the face, and you reel.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow folds you over, gasping.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow drives into your chest, and something cracks.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> hammers <ansi fg="{targettype}">{target}</ansi> across the face, and <ansi fg="{targettype}">{target}</ansi> reels.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow folds <ansi fg="{targettype}">{target}</ansi> over, gasping.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow drives into <ansi fg="{targettype}">{target}</ansi>''s chest, and something cracks.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack through the <ansi fg="exit">{exitname}</ansi> strikes <ansi fg="{targettype}">{target}</ansi> hard, and <ansi fg="{targettype}">{target}</ansi> staggers.'
      todefender:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> strikes you hard, and you stagger.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes toward the <ansi fg="exit">{exitname}</ansi>, and something cries out.'
      todefenderroom:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> strikes <ansi fg="{targettype}">{target}</ansi>, and <ansi fg="{targettype}">{target}</ansi> staggers.'
  critical:
    together:
      toattacker:
      - 'Your blow snaps <ansi fg="{targettype}">{target}</ansi>''s head back, and blood sprays from the nose.'
      - 'You smash <ansi fg="{targettype}">{target}</ansi> in the throat, and <ansi fg="{targettype}">{target}</ansi> chokes on blood.'
      - 'You drive your <ansi fg="item">{itemname}</ansi> into <ansi fg="{targettype}">{target}</ansi>''s temple, and <ansi fg="{targettype}">{target}</ansi>''s eyes roll.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow snaps your head back, and blood sprays from your nose.'
      - '<ansi fg="{sourcetype}">{source}</ansi> smashes you in the throat, and you choke on blood.'
      - '<ansi fg="{sourcetype}">{source}</ansi> drives a blow into your temple, and the world tilts.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s blow snaps <ansi fg="{targettype}">{target}</ansi>''s head back, and blood sprays from the nose.'
      - '<ansi fg="{sourcetype}">{source}</ansi> smashes <ansi fg="{targettype}">{target}</ansi> in the throat, and <ansi fg="{targettype}">{target}</ansi> chokes on blood.'
      - '<ansi fg="{sourcetype}">{source}</ansi> drives a blow into <ansi fg="{targettype}">{target}</ansi>''s temple, and <ansi fg="{targettype}">{target}</ansi>''s eyes roll.'
    # when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack through the <ansi fg="exit">{exitname}</ansi> tears into <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> tears into you.'
      toattackerroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> strikes toward the <ansi fg="exit">{exitname}</ansi>, and a scream answers.'
      todefenderroom:
      - 'Something from the <ansi fg="exit">{entrancename}</ansi> tears into <ansi fg="{targettype}">{target}</ansi>.'
