# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: claws
options:
  prepare:
    together:
      toattacker:
      - 'You flex your claws and fix your eyes on <ansi fg="{targettype}">{target}</ansi>.'
      - 'You drop low, ready to spring at <ansi fg="{targettype}">{target}</ansi>.'
      - 'You bare your teeth at <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> flexes its claws and fixes its eyes on you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> drops low, ready to spring.'
      - '<ansi fg="{sourcetype}">{source}</ansi> bares its teeth at you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> flexes its claws and fixes its eyes on <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> drops low, ready to spring at <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> bares its teeth at <ansi fg="{targettype}">{target}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You pace around <ansi fg="{targettype}">{target}</ansi>, low to the ground.'
      - 'A growl builds in your throat as you watch <ansi fg="{targettype}">{target}</ansi>.'
      - 'You crouch and wait for <ansi fg="{targettype}">{target}</ansi> to turn.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> paces around you, low to the ground.'
      - 'A growl builds in <ansi fg="{sourcetype}">{source}</ansi>''s throat.'
      - '<ansi fg="{sourcetype}">{source}</ansi> crouches and waits for you to turn.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> paces around <ansi fg="{targettype}">{target}</ansi>, low to the ground.'
      - 'A growl builds in <ansi fg="{sourcetype}">{source}</ansi>''s throat as it watches <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> crouches and waits for <ansi fg="{targettype}">{target}</ansi> to turn.'
  miss:
    together:
      toattacker:
      - 'Your claws rake the air beside <ansi fg="{targettype}">{target}</ansi>.'
      - 'You lunge at <ansi fg="{targettype}">{target}</ansi>, and your jaws snap shut on nothing.'
      - '<ansi fg="{targettype}">{target}</ansi> twists away, and your swipe falls short.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s claws rake the air beside you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> lunges, and its jaws snap shut an inch from you.'
      - 'You twist away, and <ansi fg="{sourcetype}">{source}</ansi>''s swipe falls short.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s claws rake the air beside <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> lunges at <ansi fg="{targettype}">{target}</ansi>, and its jaws snap shut on nothing.'
      - '<ansi fg="{targettype}">{target}</ansi> twists away, and <ansi fg="{sourcetype}">{source}</ansi>''s swipe falls short.'
  weak:
    together:
      toattacker:
      - 'Your claws leave thin red lines across <ansi fg="{targettype}">{target}</ansi>''s arm.'
      - 'You nip at <ansi fg="{targettype}">{target}</ansi>''s leg and draw a little blood.'
      - 'Your claws snag on <ansi fg="{targettype}">{target}</ansi>''s clothing and scratch the skin beneath.'
