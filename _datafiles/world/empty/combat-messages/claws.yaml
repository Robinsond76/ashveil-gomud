      - '<ansi fg="{sourcetype}">{source}</ansi> clamps its jaws on <ansi fg="{targettype}">{target}</ansi>''s shoulder and shakes.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s claws rip through <ansi fg="{targettype}">{target}</ansi>''s guard and into the flesh behind it.'
  critical:
    together:
      toattacker:
      - 'You bear <ansi fg="{targettype}">{target}</ansi> down and tear at the throat.'
      - 'Your claws gouge <ansi fg="{targettype}">{target}</ansi>''s face, and blood runs into the eyes.'
      - 'Your jaws close on <ansi fg="{targettype}">{target}</ansi>''s leg, and bone cracks between your teeth.'
