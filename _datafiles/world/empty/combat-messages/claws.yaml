      - '<ansi fg="{sourcetype}">{source}</ansi> sinks its teeth into <ansi fg="{targettype}">{target}</ansi>''s forearm and tears.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s claws open <ansi fg="{targettype}">{target}</ansi>''s side in three ragged lines.'
  heavy:
    together:
      toattacker:
      - 'Your claws tear deep into <ansi fg="{targettype}">{target}</ansi>''s thigh.'
      - 'You clamp your jaws on <ansi fg="{targettype}">{target}</ansi>''s shoulder and shake.'
      - 'Your claws rip through <ansi fg="{targettype}">{target}</ansi>''s guard and into the flesh behind it.'
