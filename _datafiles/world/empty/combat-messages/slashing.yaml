# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: slashing
options:
  prepare:
    together:
      toattacker:
      - 'You raise your <ansi fg="item">{itemname}</ansi> and square up to <ansi fg="{targettype}">{target}</ansi>.'
      - 'You let the point of your <ansi fg="item">{itemname}</ansi> drift toward <ansi fg="{targettype}">{target}</ansi>''s eyes.'
      - 'You shift your grip on your <ansi fg="item">{itemname}</ansi> and step toward <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> raises a blade and squares up to you.'
      - 'The point of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> drifts toward your eyes.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shifts grip and steps toward you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> raises a blade and squares up to <ansi fg="{targettype}">{target}</ansi>.'
      - 'The point of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> drifts toward <ansi fg="{targettype}">{target}</ansi>''s eyes.'
      - '<ansi fg="{sourcetype}">{source}</ansi> shifts grip and steps toward <ansi fg="{targettype}">{target}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You circle <ansi fg="{targettype}">{target}</ansi>, blade high.'
      - 'You hold your ground and watch <ansi fg="{targettype}">{target}</ansi>''s shoulders for the swing.'
      - 'You draw a slow breath and wait for <ansi fg="{targettype}">{target}</ansi> to overreach.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles you, blade high.'
      - '<ansi fg="{sourcetype}">{source}</ansi> holds ground and watches your shoulders for the swing.'
      - '<ansi fg="{sourcetype}">{source}</ansi> waits, breathing slow, for you to overreach.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles <ansi fg="{targettype}">{target}</ansi>, blade high.'
      - '<ansi fg="{sourcetype}">{source}</ansi> holds ground and watches <ansi fg="{targettype}">{target}</ansi>''s shoulders for the swing.'
      - '<ansi fg="{sourcetype}">{source}</ansi> waits, breathing slow, for <ansi fg="{targettype}">{target}</ansi> to overreach.'
  miss:
    together:
      toattacker:
      - 'Your swing at <ansi fg="{targettype}">{target}</ansi> cuts only air.'
      - 'Your <ansi fg="item">{itemname}</ansi> whistles past <ansi fg="{targettype}">{target}</ansi>''s head.'
      - 'Your <ansi fg="item">{itemname}</ansi> rings off <ansi fg="{targettype}">{target}</ansi>''s guard.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s swing at you cuts only air.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> whistles past your head.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> rings off your guard.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s swing at <ansi fg="{targettype}">{target}</ansi> cuts only air.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> whistles past <ansi fg="{targettype}">{target}</ansi>''s head.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> rings off <ansi fg="{targettype}">{target}</ansi>''s guard.'
  weak:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> opens a shallow cut along <ansi fg="{targettype}">{target}</ansi>''s arm.'
      - 'The tip of your <ansi fg="item">{itemname}</ansi> flicks across <ansi fg="{targettype}">{target}</ansi>''s cheek.'
      - 'You graze <ansi fg="{targettype}">{target}</ansi>''s knuckles, and blood beads on them.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> opens a shallow cut along your arm.'
      - 'The tip of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> flicks across your cheek.'
      - '<ansi fg="{sourcetype}">{source}</ansi> grazes your knuckles, and blood beads on them.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> opens a shallow cut along <ansi fg="{targettype}">{target}</ansi>''s arm.'
      - 'The tip of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> flicks across <ansi fg="{targettype}">{target}</ansi>''s cheek.'
      - '<ansi fg="{sourcetype}">{source}</ansi> grazes <ansi fg="{targettype}">{target}</ansi>''s knuckles, and blood beads on them.'
  normal:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> bites into <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - 'You slash <ansi fg="{targettype}">{target}</ansi> across the ribs, and cloth and skin part together.'
      - 'Your <ansi fg="item">{itemname}</ansi> catches <ansi fg="{targettype}">{target}</ansi>''s thigh on the backswing.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> bites into your shoulder.'
      - '<ansi fg="{sourcetype}">{source}</ansi> slashes you across the ribs, and cloth and skin part together.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> catches your thigh on the backswing.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> bites into <ansi fg="{targettype}">{target}</ansi>''s shoulder.'
      - '<ansi fg="{sourcetype}">{source}</ansi> slashes <ansi fg="{targettype}">{target}</ansi> across the ribs, and cloth and skin part together.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> catches <ansi fg="{targettype}">{target}</ansi>''s thigh on the backswing.'
  heavy:
    together:
      toattacker:
      - 'You bring your <ansi fg="item">{itemname}</ansi> down on <ansi fg="{targettype}">{target}</ansi>''s shoulder, and it bites to the bone.'
      - 'Your <ansi fg="item">{itemname}</ansi> carves a long, deep line across <ansi fg="{targettype}">{target}</ansi>''s chest.'
      - 'Your cut takes <ansi fg="{targettype}">{target}</ansi> across the thigh, and the leg nearly gives.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> brings a blade down on your shoulder, and it bites to the bone.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> carves a long, deep line across your chest.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s cut takes you across the thigh, and your leg nearly gives.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> brings a blade down on <ansi fg="{targettype}">{target}</ansi>''s shoulder, and it bites to the bone.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> carves a long, deep line across <ansi fg="{targettype}">{target}</ansi>''s chest.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s cut takes <ansi fg="{targettype}">{target}</ansi> across the thigh, and the leg nearly gives.'
  critical:
    together:
      toattacker:
      - 'You step inside <ansi fg="{targettype}">{target}</ansi>''s guard and open <ansi fg="{targettype}">{target}</ansi> from collarbone to hip.'
      - 'Your <ansi fg="item">{itemname}</ansi> shears through <ansi fg="{targettype}">{target}</ansi>''s guard and deep into the neck.'
      - 'Your <ansi fg="item">{itemname}</ansi> hacks into <ansi fg="{targettype}">{target}</ansi>''s side, and the blade comes out red to the hilt.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> steps inside your guard and opens you from collarbone to hip.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> shears through your guard and deep into your neck.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> hacks into your side, and the blade comes out red to the hilt.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> steps inside <ansi fg="{targettype}">{target}</ansi>''s guard and opens <ansi fg="{targettype}">{target}</ansi> from collarbone to hip.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> shears through <ansi fg="{targettype}">{target}</ansi>''s guard and deep into the neck.'
