# Phase 29c narration voice: dark and physical, no exclamation marks, no
# ALL-CAPS. The combat code appends each hit's mechanics, " (5 damage)" or
# " (critical hit, 9 damage)", and puts "the" before a lowercase name and a
# capital at the start of a line, so write names bare.
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {source}      - name of mob or user e.g. 'goblin'
# {sourcetype}  - 'user' or 'mob'
# {target}      - name of mob or user e.g. 'goblin'
# {targettype}  - 'user' or 'mob'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: stabbing
options:
  prepare:
    together:
      toattacker:
      - 'You turn your <ansi fg="item">{itemname}</ansi> point-first toward <ansi fg="{targettype}">{target}</ansi>.'
      - 'You set your feet and measure the distance to <ansi fg="{targettype}">{target}</ansi>.'
      - 'You settle low, your <ansi fg="item">{itemname}</ansi> held close, and watch <ansi fg="{targettype}">{target}</ansi>.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> turns point-first toward you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> sets both feet and measures the distance to you.'
      - '<ansi fg="{sourcetype}">{source}</ansi> settles low, the <ansi fg="item">{itemname}</ansi> held close, and watches you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> turns point-first toward <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> sets both feet and measures the distance to <ansi fg="{targettype}">{target}</ansi>.'
      - '<ansi fg="{sourcetype}">{source}</ansi> settles low, the <ansi fg="item">{itemname}</ansi> held close, and watches <ansi fg="{targettype}">{target}</ansi>.'
  wait:
    together:
      toattacker:
      - 'You circle <ansi fg="{targettype}">{target}</ansi>, looking for a gap.'
      - 'You hold your <ansi fg="item">{itemname}</ansi> low and wait for <ansi fg="{targettype}">{target}</ansi> to open up.'
      - 'You draw a slow breath and watch <ansi fg="{targettype}">{target}</ansi>''s feet.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles you, looking for a gap.'
      - '<ansi fg="{sourcetype}">{source}</ansi> holds a low guard and waits for you to open up.'
      - '<ansi fg="{sourcetype}">{source}</ansi> watches your feet and does not blink.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> circles <ansi fg="{targettype}">{target}</ansi>, looking for a gap.'
      - '<ansi fg="{sourcetype}">{source}</ansi> holds a low guard and waits for <ansi fg="{targettype}">{target}</ansi> to open up.'
      - '<ansi fg="{sourcetype}">{source}</ansi> watches <ansi fg="{targettype}">{target}</ansi>''s feet and does not blink.'
  miss:
    together:
      toattacker:
      - 'Your thrust at <ansi fg="{targettype}">{target}</ansi> stabs empty air.'
      - '<ansi fg="{targettype}">{target}</ansi> slips aside, and your <ansi fg="item">{itemname}</ansi> finds nothing.'
      - 'Your lunge at <ansi fg="{targettype}">{target}</ansi> falls a hand''s width short.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi> lunges at you and stabs empty air.'
      - 'You slip aside, and <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> finds nothing.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s lunge falls a hand''s width short of you.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi> lunges at <ansi fg="{targettype}">{target}</ansi> and stabs empty air.'
      - '<ansi fg="{targettype}">{target}</ansi> slips aside, and <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> finds nothing.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s lunge falls a hand''s width short of <ansi fg="{targettype}">{target}</ansi>.'
  weak:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> nicks <ansi fg="{targettype}">{target}</ansi>''s forearm and draws a thin line of blood.'
      - 'The point of your <ansi fg="item">{itemname}</ansi> catches <ansi fg="{targettype}">{target}</ansi>''s side and skips away.'
      - 'You prick <ansi fg="{targettype}">{target}</ansi>''s shoulder, no deeper than a thorn.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> nicks your forearm and draws a thin line of blood.'
      - 'The point of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> catches your side and skips away.'
      - '<ansi fg="{sourcetype}">{source}</ansi> pricks your shoulder, no deeper than a thorn.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> nicks <ansi fg="{targettype}">{target}</ansi>''s forearm and draws a thin line of blood.'
      - 'The point of <ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> catches <ansi fg="{targettype}">{target}</ansi>''s side and skips away.'
      - '<ansi fg="{sourcetype}">{source}</ansi> pricks <ansi fg="{targettype}">{target}</ansi>''s shoulder, no deeper than a thorn.'
  normal:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> slides into <ansi fg="{targettype}">{target}</ansi>''s thigh and comes away red.'
      - 'You drive your <ansi fg="item">{itemname}</ansi> into <ansi fg="{targettype}">{target}</ansi>''s side.'
      - 'Your thrust punches through <ansi fg="{targettype}">{target}</ansi>''s guard and into the shoulder beneath.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slides into your thigh and comes away red.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> bites into your side.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s thrust punches through your guard and into your shoulder.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slides into <ansi fg="{targettype}">{target}</ansi>''s thigh and comes away red.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> bites into <ansi fg="{targettype}">{target}</ansi>''s side.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s thrust punches through <ansi fg="{targettype}">{target}</ansi>''s guard and into the shoulder beneath.'
  heavy:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> slips under <ansi fg="{targettype}">{target}</ansi>''s guard and sinks deep into the gut.'
      - 'Your <ansi fg="item">{itemname}</ansi> goes in between <ansi fg="{targettype}">{target}</ansi>''s ribs and scrapes bone.'
      - 'Your thrust takes <ansi fg="{targettype}">{target}</ansi> high in the chest, and <ansi fg="{targettype}">{target}</ansi> staggers back.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slips under your guard and sinks deep into your gut.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> goes in between your ribs and scrapes bone.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s thrust takes you high in the chest, and you stagger back.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> slips under <ansi fg="{targettype}">{target}</ansi>''s guard and sinks deep into the gut.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> goes in between <ansi fg="{targettype}">{target}</ansi>''s ribs and scrapes bone.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s thrust takes <ansi fg="{targettype}">{target}</ansi> high in the chest, and <ansi fg="{targettype}">{target}</ansi> staggers back.'
  critical:
    together:
      toattacker:
      - 'You find the gap beneath <ansi fg="{targettype}">{target}</ansi>''s arm, drive your <ansi fg="item">{itemname}</ansi> in to the hilt, and twist.'
      - 'Your <ansi fg="item">{itemname}</ansi> punches into <ansi fg="{targettype}">{target}</ansi>''s throat, and blood sheets down the blade.'
      - 'You bury your <ansi fg="item">{itemname}</ansi> in <ansi fg="{targettype}">{target}</ansi>''s belly and wrench it free in a gout of blood.'
      todefender:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> finds the gap beneath your arm, sinks to the hilt, and twists.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> punches into your throat, and blood sheets down the blade.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> sinks into your belly and wrenches free in a gout of blood.'
      toroom:
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> finds the gap beneath <ansi fg="{targettype}">{target}</ansi>''s arm, sinks to the hilt, and twists.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> punches into <ansi fg="{targettype}">{target}</ansi>''s throat, and blood sheets down the blade.'
      - '<ansi fg="{sourcetype}">{source}</ansi>''s <ansi fg="item">{itemname}</ansi> sinks into <ansi fg="{targettype}">{target}</ansi>''s belly and wrenches free in a gout of blood.'
